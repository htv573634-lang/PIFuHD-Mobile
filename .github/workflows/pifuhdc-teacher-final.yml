name: PIFuHDC Final Teacher Test

on:
  workflow_dispatch:

jobs:
  teacher-final:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git wget curl build-essential \
            libgl1 libglib2.0-0 libsm6 libxext6 libxrender1

      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            pygltflib \
            gdown \
            torch==2.1.2 \
            torchvision==0.16.2

      # ============================================================
      # VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify environment
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import cv2
          import numpy
          print("Torch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("OpenCV:", cv2.__version__)
          print("NumPy:", numpy.__version__)
          print("CUDA:", torch.cuda.is_available())
          PY

      # ============================================================
      # CLONE PIFuHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc
          git clone --depth 1 https://github.com/xiahongchi/PIFuHDC.git pifuhdc

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: mkdir -p checkpoints

      # ============================================================
      # CACHE CHECKPOINTS
      # ============================================================

      - name: Restore checkpoint cache
        uses: actions/cache@v4
        with:
          path: pifuhdc/checkpoints
          key: pifuhdc-checkpoints-v1
          restore-keys: |
            pifuhdc-checkpoints-

      # ============================================================
      # DOWNLOAD CHECKPOINTS
      # ============================================================

      - name: Download geometry checkpoint
        working-directory: pifuhdc
        run: |
          if [ ! -s checkpoints/pifuhd.pt ]; then
            wget --show-progress \
              https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
              -O checkpoints/pifuhd.pt
          fi

      - name: Download color checkpoint
        working-directory: pifuhdc
        run: |
          if [ ! -s checkpoints/net_C_HD.pt ]; then
            gdown \
              1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
              -O checkpoints/net_C_HD.pt
          fi

      # ============================================================
      # PATCH PIFuHDC
      # ============================================================

      - name: Patch PIFuHDC
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          recon = Path("apps/recon.py")
          text = recon.read_text()
          text = text.replace(
              "checkpoints/net_C_choice2.pt",
              "checkpoints/net_C_HD.pt"
          )
          recon.write_text(text)

          mesh = Path("lib/mesh_util.py")
          text = mesh.read_text()
          text = text.replace(
              "measure.marching_cubes_lewiner",
              "measure.marching_cubes"
          )
          mesh.write_text(text)

          print("PIFuHDC patched successfully.")
          PY

      # ============================================================
      # VERIFY IMPORTS
      # ============================================================

      - name: Verify imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,".")
          import apps.recon
          import lib.mesh_util
          print("Imports OK.")
          PY

      # ============================================================
      # PREPARE DATASET
      # ============================================================

      - name: Prepare dataset
        run: |
          rm -rf teacher_input teacher_output
          mkdir -p teacher_input teacher_output

          mapfile -t INPUTS < <(
            find dataset/input -type f \
              \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
              | sort
          )

          COUNT=${#INPUTS[@]}

          echo "Images found: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            exit 1
          fi

          if [ "$COUNT" -gt 2 ]; then
            echo "Use 1-2 photos."
            exit 1
          fi

          INDEX=1

          for IMG in "${INPUTS[@]}"; do

            OUT="teacher_input/view_$(printf '%03d' $INDEX).jpg"

            python - "$IMG" "$OUT" <<'PY'
          import sys
          from PIL import Image

          img=Image.open(sys.argv[1]).convert("RGB")
          img.save(sys.argv[2],quality=100)

          w,h=img.size

          open(
              sys.argv[2].replace(".jpg","_rect.txt"),
              "w"
          ).write(f"0 0 {w} {h}\n")
          PY

            INDEX=$((INDEX+1))
          done

      # ============================================================
      # RUN TEACHER
      # ============================================================

      - name: Run PIFuHDC
        working-directory: pifuhdc
        run: |
          set -o pipefail

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 512 \
            --use_rect \
            2>&1 | tee ../teacher_output/pifuhdc.log

      # ============================================================
      # FIXED MESH COLLECTION
      # ============================================================

      - name: Collect meshes
        run: |
          set -e

          mkdir -p teacher_output/final

          rm -f teacher_output/final/*.obj

          INDEX=1

          while IFS= read -r OBJ; do

            DEST="teacher_output/final/view_$(printf '%03d' $INDEX).obj"

            cp "$OBJ" "$DEST"

            echo "$OBJ -> $DEST"

            INDEX=$((INDEX+1))

          done < <(
            find teacher_output \
              -type f \
              -iname "*.obj" \
              ! -path "teacher_output/final/*" \
              | sort
          )

      # ============================================================
      # OBJ -> GLB
      # ============================================================

      - name: Convert OBJ to GLB
        run: |
          cat > convert_obj.py <<'PY'
          from pathlib import Path
          import json
          import struct

          def read_obj(path):
              verts=[]
              cols=[]
              faces=[]

              for line in open(path,"r",errors="ignore"):

                  if line.startswith("v "):

                      p=line.split()

                      verts.append([
                          float(p[1]),
                          float(p[2]),
                          float(p[3])
                      ])

                      if len(p)>=7:
                          rgb=list(map(float,p[4:7]))
                          if max(rgb)<=1:
                              rgb=[v*255 for v in rgb]
                      else:
                          rgb=[200,200,200]

                      cols.append([
                          round(rgb[0]),
                          round(rgb[1]),
                          round(rgb[2]),
                          255
                      ])

                  elif line.startswith("f "):

                      idx=[]

                      for s in line.split()[1:]:
                          i=int(s.split("/")[0])
                          idx.append(i-1 if i>0 else len(verts)+i)

                      for i in range(1,len(idx)-1):
                          faces.append([
                              idx[0],
                              idx[i],
                              idx[i+1]
                          ])

              return verts,cols,faces

          def pack(v,c,f):

              pos=b''.join(struct.pack('<fff',*x) for x in v)
              col=bytes(x for rgba in c for x in rgba)
              ind=b''.join(struct.pack('<III',*x) for x in f)

              def pad(d):
                  while len(d)%4:d+=b'\0'
                  return d

              pos=pad(pos)
              col=pad(col)
              ind=pad(ind)

              off1=0
              off2=len(pos)
              off3=off2+len(col)

              bin=pos+col+ind

              xs=[x[0] for x in v]
              ys=[x[1] for x in v]
              zs=[x[2] for x in v]

              gltf={
                  "asset":{"version":"2.0"},
                  "scene":0,
                  "scenes":[{"nodes":[0]}],
                  "nodes":[{"mesh":0}],
                  "meshes":[{
                      "primitives":[{
                          "attributes":{"POSITION":0,"COLOR_0":1},
                          "indices":2
                      }]
                  }],
                  "accessors":[
                      {"bufferView":0,"componentType":5126,"count":len(v),"type":"VEC3","min":[min(xs),min(ys),min(zs)],"max":[max(xs),max(ys),max(zs)]},
                      {"bufferView":1,"componentType":5121,"normalized":True,"count":len(c),"type":"VEC4"},
                      {"bufferView":2,"componentType":5125,"count":len(f)*3,"type":"SCALAR"}
                  ],
                  "bufferViews":[
                      {"buffer":0,"byteOffset":off1,"byteLength":len(pos),"target":34962},
                      {"buffer":0,"byteOffset":off2,"byteLength":len(col),"target":34962},
                      {"buffer":0,"byteOffset":off3,"byteLength":len(ind),"target":34963}
                  ],
                  "buffers":[{"byteLength":len(bin)}]
              }

              js=json.dumps(gltf,separators=(",",":")).encode()

              while len(js)%4:js+=b' '
              while len(bin)%4:bin+=b'\0'

              return (
                  struct.pack("<4sII",b"glTF",2,12+8+len(js)+8+len(bin))+
                  struct.pack("<II",len(js),0x4E4F534A)+js+
                  struct.pack("<II",len(bin),0x004E4942)+bin
              )

          for obj in Path("teacher_output/final").glob("*.obj"):
              v,c,f=read_obj(obj)
              obj.with_suffix(".glb").write_bytes(pack(v,c,f))
              print("Converted:",obj)
          PY

          python convert_obj.py

      # ============================================================
      # VALIDATE GLB
      # ============================================================

      - name: Validate GLB
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import struct

          for glb in Path("teacher_output/final").glob("*.glb"):

              d=glb.read_bytes()

              assert d[:4]==b"glTF"

              l=struct.unpack("<I",d[12:16])[0]

              js=json.loads(d[20:20+l].decode())

              attrs=js["meshes"][0]["primitives"][0]["attributes"]

              assert "POSITION" in attrs
              assert "COLOR_0" in attrs

              print(glb.name,"OK")
          PY

      # ============================================================
      # REPORT
      # ============================================================

      - name: Final report
        if: always()
        run: |
          {
            echo "PIFuHDC FINAL TEACHER"
            echo
            echo "Input:"
            find teacher_input -type f | sort
            echo
            echo "Output:"
            find teacher_output/final -type f | sort
          } > teacher_output/final_teacher_report.txt

          cat teacher_output/final_teacher_report.txt

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-final-teacher-512
          path: |
            teacher_input/
            teacher_output/
          retention-days: 14
