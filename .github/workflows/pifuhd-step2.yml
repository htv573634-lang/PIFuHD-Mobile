name: Step 2 - PIFuHDC Color Baseline + Quantization

on:
  workflow_dispatch:

jobs:
  pifuhdc:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            libgl1 \
            libglib2.0-0

      - name: Clone PIFuHDC
        run: |
          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            trimesh \
            tqdm \
            pillow \
            requests

          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Show environment
        run: |
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.cuda.is_available())"

      - name: Download PIFuHDC pretrained models
        run: |
          cd pifuhdc

          chmod +x scripts/download_trained_model.sh

          ./scripts/download_trained_model.sh

          echo "===== CHECKPOINTS ====="
          ls -lh checkpoints/

      - name: Verify checkpoints
        run: |
          python - <<'PY'
          import os

          root = "pifuhdc/checkpoints"

          print("Checkpoint directory:")
          for name in os.listdir(root):
              path = os.path.join(root, name)
              size = os.path.getsize(path)

              print(
                  name,
                  round(size / 1024 / 1024, 2),
                  "MB"
              )

          print("Checkpoint verification completed.")
          PY

      - name: Prepare input/output
        run: |
          mkdir -p pifuhdc/images
          mkdir -p pifuhdc/results

          cp samples/input/test_person.png pifuhdc/images/test_person.png

      - name: Check PIFuHDC color test
        run: |
          cd pifuhdc

          python -m apps.test_colorHD --help || true

      - name: Run PIFuHDC color reconstruction
        continue-on-error: true
        run: |
          cd pifuhdc

          python -m apps.test_colorHD \
            --input_path ./images \
            --out_path ./results \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt

      - name: Collect generated files
        if: always()
        run: |
          echo "===== RESULTS ====="

          find pifuhdc/results \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

      # ---------------------------------------------------------
      # Quantization preparation
      # ---------------------------------------------------------

      - name: Create quantization workspace
        run: |
          mkdir -p models/quantized
          mkdir -p conversion

      - name: Analyze PIFuHDC checkpoints
        run: |
          python - <<'PY'
          import os
          import torch

          files = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt"
          ]

          for path in files:
              print("\n==============================")
              print(path)
              print("==============================")

              if not os.path.exists(path):
                  print("MISSING")
                  continue

              size = os.path.getsize(path)

              print(
                  "File size:",
                  round(size / 1024 / 1024, 2),
                  "MB"
              )

              try:
                  obj = torch.load(
                      path,
                      map_location="cpu"
                  )

                  if isinstance(obj, dict):
                      print("Checkpoint dictionary keys:")
                      print(list(obj.keys())[:20])

                      total = 0

                      def count(obj):
                          global total

                          if isinstance(obj, torch.Tensor):
                              return obj.numel()

                          if isinstance(obj, dict):
                              return sum(
                                  count(v)
                                  for v in obj.values()
                              )

                          if isinstance(obj, (list, tuple)):
                              return sum(
                                  count(v)
                                  for v in obj
                              )

                          return 0

                      total = count(obj)

                      print(
                          "Tensor elements:",
                          total
                      )

                      print(
                          "Approx FP32 tensor size:",
                          round(
                              total * 4 / 1024 / 1024,
                              2
                          ),
                          "MB"
                      )

              except Exception as e:
                  print(
                      "Checkpoint analysis failed:",
                      repr(e)
                  )
          PY

      # ---------------------------------------------------------
      # FP16 conversion
      # ---------------------------------------------------------

      - name: Convert checkpoint tensors to FP16
        run: |
          python - <<'PY'
          import os
          import torch

          source_dir = "pifuhdc/checkpoints"
          output_dir = "models/quantized"

          files = [
              "pifuhd.pt",
              "net_C_HD.pt"
          ]

          def convert(obj):
              if isinstance(obj, torch.Tensor):
                  if obj.is_floating_point():
                      return obj.half()
                  return obj

              if isinstance(obj, dict):
                  return {
                      k: convert(v)
                      for k, v in obj.items()
                  }

              if isinstance(obj, list):
                  return [convert(v) for v in obj]

              if isinstance(obj, tuple):
                  return tuple(convert(v) for v in obj)

              return obj

          for name in files:
              source = os.path.join(source_dir, name)

              if not os.path.exists(source):
                  print("Skipping missing:", source)
                  continue

              print("Converting:", source)

              data = torch.load(
                  source,
                  map_location="cpu"
              )

              converted = convert(data)

              destination = os.path.join(
                  output_dir,
                  name.replace(".pt", "_fp16.pt")
              )

              torch.save(
                  converted,
                  destination
              )

              original_size = os.path.getsize(source)
              new_size = os.path.getsize(destination)

              print(
                  "Original:",
                  round(original_size / 1024 / 1024, 2),
                  "MB"
              )

              print(
                  "FP16:",
                  round(new_size / 1024 / 1024, 2),
                  "MB"
              )

      - name: Verify FP16 checkpoints
        run: |
          ls -lh models/quantized/

      # ---------------------------------------------------------
      # INT8 preparation
      # ---------------------------------------------------------

      - name: Create INT8 checkpoint experiment
        run: |
          python - <<'PY'
          import os
          import torch

          source_dir = "models/quantized"
          output_dir = "models/quantized"

          files = [
              "pifuhd_fp16.pt",
              "net_C_HD_fp16.pt"
          ]

          def quantize_tensor(x):
              if not x.is_floating_point():
                  return x

              # Symmetric per-tensor INT8 experiment.
              max_value = x.abs().max()

              if max_value == 0:
                  scale = torch.tensor(
                      1.0,
                      dtype=torch.float32
                  )
              else:
                  scale = max_value / 127.0

              q = torch.clamp(
                  torch.round(x / scale),
                  -127,
                  127
              ).to(torch.int8)

              return {
                  "__int8__": True,
                  "tensor": q,
                  "scale": scale.float()
              }

          def quantize(obj):
              if isinstance(obj, torch.Tensor):
                  return quantize_tensor(obj)

              if isinstance(obj, dict):
                  return {
                      k: quantize(v)
                      for k, v in obj.items()
                  }

              if isinstance(obj, list):
                  return [quantize(v) for v in obj]

              if isinstance(obj, tuple):
                  return tuple(
                      quantize(v)
                      for v in obj
                  )

              return obj

          for name in files:
              source = os.path.join(
                  source_dir,
                  name
              )

              if not os.path.exists(source):
                  print("Skipping:", source)
                  continue

              print("Experimental INT8 conversion:", name)

              data = torch.load(
                  source,
                  map_location="cpu"
              )

              converted = quantize(data)

              destination = os.path.join(
                  output_dir,
                  name.replace(
                      "_fp16.pt",
                      "_int8_experimental.pt"
                  )
              )

              torch.save(
                  converted,
                  destination
              )

              print(
                  "Saved:",
                  destination
              )
          PY

      - name: Show model sizes
        run: |
          echo "===== MODEL SIZE COMPARISON ====="
          find pifuhdc/checkpoints models/quantized \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

      - name: Upload PIFuHDC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-step2-results
          path: |
            pifuhdc/results/
            pifuhdc/checkpoints/
            models/quantized/
          if-no-files-found: warn
          retention-days: 7
