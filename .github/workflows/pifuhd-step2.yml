name: Step 2 - PIFuHD Inference Test

on:
  workflow_dispatch:

jobs:
  pifuhd-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PIFuHD-Mobile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            libgl1 \
            libglib2.0-0

      - name: Clone official PIFuHD
        run: |
          git clone --depth 1 https://github.com/facebookresearch/pifuhd.git pifuhd

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            scikit-image \
            opencv-python-headless \
            trimesh \
            tqdm \
            pillow \
            requests

          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Show environment
        run: |
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torchvision; print('TorchVision:', torchvision.__version__)"

      - name: Prepare PIFuHD directories
        run: |
          mkdir -p pifuhd/checkpoints
          mkdir -p samples/input
          mkdir -p samples/output

      - name: Download PIFuHD checkpoint
        run: |
          cd pifuhd

          wget -O checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

          ls -lh checkpoints/pifuhd.pt

      - name: Verify checkpoint
        run: |
          python - <<'PY'
          import os
          import torch

          path = "pifuhd/checkpoints/pifuhd.pt"

          if not os.path.exists(path):
              raise SystemExit("ERROR: PIFuHD checkpoint was not downloaded.")

          size = os.path.getsize(path)

          print("Checkpoint:", path)
          print("Size:", size, "bytes")
          print("Size:", round(size / 1024 / 1024, 2), "MB")

          if size < 100 * 1024 * 1024:
              raise SystemExit("ERROR: Checkpoint looks too small.")

          print("Checkpoint file exists and size looks valid.")
          PY

      - name: Create test image
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (512, 512), "white")
          draw = ImageDraw.Draw(img)

          draw.rectangle((170, 80, 340, 420), outline="black", width=4)
          draw.ellipse((210, 110, 300, 200), outline="black", width=4)
          draw.line((255, 200, 255, 350), fill="black", width=5)
          draw.line((255, 230, 190, 300), fill="black", width=5)
          draw.line((255, 230, 320, 300), fill="black", width=5)
          draw.line((255, 350, 205, 430), fill="black", width=5)
          draw.line((255, 350, 305, 430), fill="black", width=5)

          img.save("samples/input/test_person.png")
          print("Created samples/input/test_person.png")
          PY

      - name: Check PIFuHD source
        run: |
          find pifuhd -maxdepth 2 -type f | sort | head -100

      - name: Run PIFuHD smoke test
        run: |
          cd pifuhd

          python -u -m apps.simple_test \
            --input_path ../samples/input/test_person.png \
            --out_path ../samples/output

      - name: Show generated files
        if: always()
        run: |
          echo "===== OUTPUT ====="
          find samples/output -type f -printf '%p %s bytes\n' 2>/dev/null || true

          echo "===== PIFuHD CHECKPOINT ====="
          ls -lh pifuhd/checkpoints/ 2>/dev/null || true

      - name: Upload PIFuHD output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhd-step2-output
          path: |
            samples/output/
            samples/input/
            pifuhd/checkpoints/pifuhd.pt
          if-no-files-found: warn
          retention-days: 7
