name: Step 2 - PIFuHDC Color Baseline

on:
  workflow_dispatch:

jobs:
  pifuhdc:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            pillow \
            tqdm \
            trimesh \
            requests \
            gdown

          pip install torch==2.1.2 torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Show environment
        run: |
          python --version

          python - <<'PY'
          import torch
          import torchvision

          print("PyTorch:", torch.__version__)
          print("TorchVision:", torchvision.__version__)
          print("CUDA available:", torch.cuda.is_available())
          PY

      # ==========================================================
      # DOWNLOAD MODELS
      # ==========================================================

      - name: Prepare checkpoint directory
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt

      - name: Download PIFuHD checkpoint
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

      - name: Download PIFuHDC color checkpoint
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt

      # ==========================================================
      # VERIFY MODELS
      # ==========================================================

      - name: Verify both checkpoints
        run: |
          python - <<'PY'
          import os

          models = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt"
          ]

          print()
          print("======================================")
          print("PIFuHDC MODEL VERIFICATION")
          print("======================================")

          for path in models:
              print()
              print("Model:", path)

              if not os.path.exists(path):
                  raise RuntimeError(
                      "MODEL MISSING: " + path
                  )

              size = os.path.getsize(path)

              print(
                  "Bytes:",
                  size
              )

              print(
                  "MB:",
                  round(size / 1024 / 1024, 2)
              )

              print(
                  "GB:",
                  round(size / 1024 / 1024 / 1024, 3)
              )

              if size < 10 * 1024 * 1024:
                  raise RuntimeError(
                      "Model is suspiciously small: " + path
                  )

          print()
          print("Both checkpoints downloaded successfully.")
          PY

      - name: List checkpoints
        run: |
          ls -lh pifuhdc/checkpoints/

      # ==========================================================
      # MODEL STRUCTURE ANALYSIS
      # ==========================================================

      - name: Analyze PIFuHD checkpoint
        run: |
          python - <<'PY'
          import torch
          import os

          path = "pifuhdc/checkpoints/pifuhd.pt"

          print()
          print("======================================")
          print("PIFuHD CHECKPOINT ANALYSIS")
          print("======================================")

          obj = torch.load(
              path,
              map_location="cpu"
          )

          print("Object type:", type(obj))

          if isinstance(obj, dict):
              print("Top-level keys:")

              for key in list(obj.keys())[:30]:
                  print(" -", key)

          print("Checkpoint loaded successfully.")
          PY

      - name: Analyze PIFuHDC color checkpoint
        run: |
          python - <<'PY'
          import torch

          path = "pifuhdc/checkpoints/net_C_HD.pt"

          print()
          print("======================================")
          print("PIFuHDC COLOR CHECKPOINT ANALYSIS")
          print("======================================")

          obj = torch.load(
              path,
              map_location="cpu"
          )

          print("Object type:", type(obj))

          if isinstance(obj, dict):
              print("Top-level keys:")

              for key in list(obj.keys())[:30]:
                  print(" -", key)

          print("Color checkpoint loaded successfully.")
          PY

      # ==========================================================
      # PREPARE TEST IMAGE
      # ==========================================================

      - name: Prepare test image
        run: |
          mkdir -p pifuhdc/images
          mkdir -p pifuhdc/results

          python - <<'PY'
          from PIL import Image

          # Copy our existing test image if available.
          import os
          import shutil

          source = "samples/input/test_person.png"
          destination = "pifuhdc/images/test_person.png"

          if os.path.exists(source):
              shutil.copy2(
                  source,
                  destination
              )
              print("Using existing test image.")
          else:
              # Fallback image.
              img = Image.new(
                  "RGB",
                  (512, 512),
                  "white"
              )

              img.save(destination)

              print("Created fallback test image.")
          PY

      # ==========================================================
      # CHECK PIFuHDC TEST PROGRAM
      # ==========================================================

      - name: Inspect color test program
        run: |
          cd pifuhdc

          echo "===== test_colorHD.py ====="

          if [ -f apps/test_colorHD.py ]; then
            sed -n '1,260p' apps/test_colorHD.py
          else
            echo "test_colorHD.py not found"
            find apps -maxdepth 2 -type f | sort
          fi

      # ==========================================================
      # RUN PIFuHDC
      # ==========================================================

      - name: Run PIFuHDC color reconstruction
        run: |
          cd pifuhdc

          python -m apps.test_colorHD \
            --input_path ./images \
            --out_path ./results \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt

      # ==========================================================
      # INSPECT RESULT
      # ==========================================================

      - name: Inspect generated 3D files
        if: always()
        run: |
          echo "======================================"
          echo "PIFuHDC RESULTS"
          echo "======================================"

          find pifuhdc/results \
            -type f \
            -printf "%p | %s bytes\n" \
            2>/dev/null || true

      # ==========================================================
      # SAVE MODEL REPORT
      # ==========================================================

      - name: Create model report
        if: always()
        run: |
          mkdir -p reports

          {
            echo "PIFuHDC MODEL REPORT"
            echo "===================="
            echo
            echo "PIFuHD:"
            ls -lh pifuhdc/checkpoints/pifuhd.pt
            echo
            echo "PIFuHDC Color:"
            ls -lh pifuhdc/checkpoints/net_C_HD.pt
            echo
            echo "Generated files:"
            find pifuhdc/results \
              -type f \
              -printf "%p %s bytes\n" \
              2>/dev/null || true
          } > reports/pifuhdc_model_report.txt

          cat reports/pifuhdc_model_report.txt

      # ==========================================================
      # UPLOAD EVERYTHING WE NEED
      # ==========================================================

      - name: Upload PIFuHDC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-baseline-results
          path: |
            pifuhdc/results/
            pifuhdc/checkpoints/
            reports/
          if-no-files-found: warn
          retention-days: 7
