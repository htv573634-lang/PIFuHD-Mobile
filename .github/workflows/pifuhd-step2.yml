name: Step 2 - PIFuHDC Baseline

on:
  workflow_dispatch:

jobs:
  pifuhdc:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0

      - name: Clone PIFuHDC
        run: |
          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            pillow \
            tqdm \
            trimesh \
            requests

          pip install torch==2.1.2 torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Inspect PIFuHDC
        run: |
          echo "===== PIFuHDC files ====="
          find pifuhdc -maxdepth 2 -type f | sort

          echo "===== Download script ====="
          cat pifuhdc/scripts/download_trained_model.sh

      # --------------------------------------------------
      # PIFuHD checkpoint
      # --------------------------------------------------

      - name: Download PIFuHD checkpoint
        run: |
          mkdir -p pifuhdc/checkpoints

          wget -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

      - name: Verify PIFuHD checkpoint
        run: |
          ls -lh pifuhdc/checkpoints/pifuhd.pt

          python - <<'PY'
          import os

          p = "pifuhdc/checkpoints/pifuhd.pt"
          size = os.path.getsize(p)

          print("PIFuHD checkpoint bytes:", size)
          print("PIFuHD checkpoint MB:", round(size / 1024 / 1024, 2))

          if size < 1_400_000_000:
              raise RuntimeError("PIFuHD checkpoint is unexpectedly small")

          print("PIFuHD checkpoint OK")
          PY

      # --------------------------------------------------
      # PIFuHDC color checkpoint
      # --------------------------------------------------

      - name: Download PIFuHDC color checkpoint
        run: |
          echo "Searching repository metadata for net_C_HD.pt"

          grep -Rni \
            "net_C_HD" \
            pifuhdc \
            --exclude="*.pyc" \
            || true

          echo "===== checkpoint directory ====="
          ls -lah pifuhdc/checkpoints

      - name: Run official PIFuHDC downloader
        run: |
          cd pifuhdc

          # Run downloader only for the color model.
          # The PIFuHD model is already downloaded explicitly above.
          bash scripts/download_trained_model.sh || true

          echo "===== checkpoints after downloader ====="
          ls -lah checkpoints

      - name: Locate color checkpoint
        run: |
          echo "===== Searching for color checkpoint ====="

          find pifuhdc \
            -type f \
            \( -iname "*net_C*" -o -iname "*color*" \) \
            -printf "%p %s bytes\n" \
            || true

      # --------------------------------------------------
      # Create test image
      # --------------------------------------------------

      - name: Prepare test input
        run: |
          mkdir -p pifuhdc/images
          mkdir -p pifuhdc/results

          python - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (512, 512), "white")
          d = ImageDraw.Draw(img)

          d.ellipse(
              (210, 60, 302, 152),
              outline="black",
              width=4
          )

          d.rectangle(
              (175, 150, 337, 365),
              outline="black",
              width=4
          )

          d.line(
              (220, 190, 150, 300),
              fill="black",
              width=5
          )

          d.line(
              (292, 190, 362, 300),
              fill="black",
              width=5
          )

          d.line(
              (220, 365, 170, 450),
              fill="black",
              width=5
          )

          d.line(
              (292, 365, 342, 450),
              fill="black",
              width=5
          )

          img.save(
              "pifuhdc/images/test_person.png"
          )

          print("Test image created")
          PY

      # --------------------------------------------------
      # Check test command
      # --------------------------------------------------

      - name: Check PIFuHDC test arguments
        run: |
          cd pifuhdc

          python -m apps.test_colorHD --help \
            || python apps/test_colorHD.py --help \
            || true

      # --------------------------------------------------
      # Run color reconstruction
      # --------------------------------------------------

      - name: Run PIFuHDC
        run: |
          cd pifuhdc

          if [ ! -f checkpoints/pifuhd.pt ]; then
            echo "ERROR: pifuhd.pt missing"
            exit 1
          fi

          COLOR=$(find checkpoints \
            -type f \
            \( -name "net_C_HD.pt" -o -name "*C_HD*.pt" \) \
            | head -1)

          if [ -z "$COLOR" ]; then
            echo "ERROR: net_C_HD.pt was not found."
            echo "Available checkpoints:"
            find checkpoints -type f -printf "%p %s bytes\n"
            exit 1
          fi

          echo "Color checkpoint:"
          echo "$COLOR"

          python -m apps.test_colorHD \
            --input_path ./images \
            --out_path ./results \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color "$COLOR"

      # --------------------------------------------------
      # Inspect output
      # --------------------------------------------------

      - name: Inspect reconstruction
        if: always()
        run: |
          echo "===== PIFuHDC OUTPUT ====="

          find pifuhdc/results \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

      # --------------------------------------------------
      # Model analysis
      # --------------------------------------------------

      - name: Analyze checkpoints
        if: always()
        run: |
          python - <<'PY'
          import os

          root = "pifuhdc/checkpoints"

          print("CHECKPOINT ANALYSIS")
          print("===================")

          for root_dir, dirs, files in os.walk(root):
              for name in files:
                  path = os.path.join(root_dir, name)
                  size = os.path.getsize(path)

                  print(
                      name,
                      "|",
                      size,
                      "bytes |",
                      round(size / 1024 / 1024, 2),
                      "MB"
                  )
          PY

      # --------------------------------------------------
      # Upload
      # --------------------------------------------------

      - name: Upload PIFuHDC artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-baseline
          path: |
            pifuhdc/results/
            pifuhdc/checkpoints/
          if-no-files-found: warn
          retention-days: 7
