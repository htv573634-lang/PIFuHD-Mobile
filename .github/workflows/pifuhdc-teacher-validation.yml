name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pifuhdc-teacher:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2


      # ============================================================
      # ENVIRONMENT CHECK
      # ============================================================

      - name: Check environment
        run: |
          python - <<'PY'
          import sys
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL

          print("==========================================")
          print("ENVIRONMENT")
          print("==========================================")

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)

          print("")
          print(
              "CUDA available:",
              torch.cuda.is_available()
          )

          if torch.cuda.is_available():
              print(
                  "GPU:",
                  torch.cuda.get_device_name(0)
              )

          print("")
          print("Environment OK.")
          PY


      # ============================================================
      # CLONE OFFICIAL PIFUHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo ""
          echo "PIFuHDC repository:"
          find pifuhdc \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200


      # ============================================================
      # CHECKPOINT DIRECTORY
      # ============================================================

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "Checkpoint directory:"
          ls -lah checkpoints


      # ============================================================
      # RESTORE MODEL CACHE
      # ============================================================

      - name: Restore PIFuHDC checkpoint cache
        uses: actions/cache@v4
        with:
          path: pifuhdc/checkpoints
          key: pifuhdc-checkpoints-v1
          restore-keys: |
            pifuhdc-checkpoints-


      # ============================================================
      # DOWNLOAD GEOMETRY IF NOT CACHED
      # ============================================================

      - name: Download PIFuHD geometry checkpoint if needed
        working-directory: pifuhdc
        shell: bash
        run: |
          echo "=========================================="
          echo "PIFuHD GEOMETRY CHECKPOINT"
          echo "=========================================="

          if [ -s checkpoints/pifuhd.pt ]; then

            echo ""
            echo "CACHE HIT"
            echo "Geometry checkpoint already exists."

          else

            echo ""
            echo "CACHE MISS"
            echo "Downloading geometry checkpoint..."

            wget \
              --show-progress \
              https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
              -O checkpoints/pifuhd.pt

          fi

          test -s checkpoints/pifuhd.pt

          echo ""
          echo "Geometry checkpoint:"
          ls -lh checkpoints/pifuhd.pt


      # ============================================================
      # DOWNLOAD COLOR IF NOT CACHED
      # ============================================================

      - name: Download PIFuHDC color checkpoint if needed
        working-directory: pifuhdc
        shell: bash
        run: |
          echo "=========================================="
          echo "PIFuHDC COLOR CHECKPOINT"
          echo "=========================================="

          if [ -s checkpoints/net_C_HD.pt ]; then

            echo ""
            echo "CACHE HIT"
            echo "Color checkpoint already exists."

          else

            echo ""
            echo "CACHE MISS"
            echo "Downloading color checkpoint..."

            gdown \
              1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
              -O checkpoints/net_C_HD.pt

          fi

          test -s checkpoints/net_C_HD.pt

          echo ""
          echo "Color checkpoint:"
          ls -lh checkpoints/net_C_HD.pt


      # ============================================================
      # VERIFY CHECKPOINTS
      # ============================================================

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINT VERIFICATION"
          echo "=========================================="

          test -s checkpoints/pifuhd.pt
          test -s checkpoints/net_C_HD.pt

          echo ""
          echo "Geometry:"
          ls -lh checkpoints/pifuhd.pt

          echo ""
          echo "Color:"
          ls -lh checkpoints/net_C_HD.pt

          echo ""
          echo "Checkpoint files are ready."


      # ============================================================
      # PREPARE TEACHER INPUT
      # ============================================================

      - name: Prepare teacher input
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "=========================================="
          echo "DOWNLOADING OFFICIAL SAMPLE"
          echo "=========================================="

          wget \
            --show-progress \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg \
            -O teacher_input/sample.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "teacher_input/sample.jpg"
          )

          image = Image.open(
              image_path
          )

          width, height = image.size

          print("")
          print("==========================================")
          print("INPUT IMAGE")
          print("==========================================")

          print("Path:", image_path)
          print("Width:", width)
          print("Height:", height)
          print("Mode:", image.mode)

          image.verify()

          rect = Path(
              "teacher_input/sample_rect.txt"
          )

          rect.write_text(
              f"0 0 {width} {height}\n"
          )

          print("")
          print("Rectangle:")
          print(
              rect.read_text()
          )

          print("")
          print("Input image verified.")
          PY

          echo ""
          echo "Input files:"
          ls -lah teacher_input


      # ============================================================
      # VERIFY PIFUHDC MODULES
      # ============================================================

      - name: Verify PIFuHDC modules
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(
              0,
              "."
          )

          print("==========================================")
          print("PIFuHDC MODULE TEST")
          print("==========================================")

          import lib
          import lib.mesh_util
          import lib.options
          import apps
          import apps.recon

          print("lib: OK")
          print("lib.mesh_util: OK")
          print("lib.options: OK")
          print("apps: OK")
          print("apps.recon: OK")

          print("")
          print("PIFuHDC modules loaded successfully.")
          PY


      # ============================================================
      # CONFIGURE COLOR CHECKPOINT
      # ============================================================

      - name: Configure recon.py color checkpoint
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "apps/recon.py"
          )

          text = path.read_text()

          print("==========================================")
          print("CONFIGURING COLOR CHECKPOINT")
          print("==========================================")

          old = "checkpoints/net_C_choice2.pt"
          new = "checkpoints/net_C_HD.pt"

          if old in text:

              text = text.replace(
                  old,
                  new
              )

              path.write_text(
                  text
              )

              print("Changed:")
              print(old)

              print("")
              print("To:")
              print(new)

          else:

              print(
                  "Default color checkpoint reference "
                  "not found."
              )
          PY


      # ============================================================
      # FIX OLD SCIKIT-IMAGE API
      # ============================================================

      - name: Fix scikit-image Marching Cubes API
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/mesh_util.py"
          )

          print("==========================================")
          print("FIXING MARCHING CUBES API")
          print("==========================================")

          if not path.exists():

              raise SystemExit(
                  "ERROR: lib/mesh_util.py not found"
              )

          text = path.read_text()

          old = (
              "measure.marching_cubes_lewiner"
          )

          new = (
              "measure.marching_cubes"
          )

          if old in text:

              text = text.replace(
                  old,
                  new
              )

              path.write_text(
                  text
              )

              print(
                  "Fixed:",
                  old,
                  "->",
                  new
              )

          else:

              print(
                  "Old API not present."
              )


      # ============================================================
      # VERIFY MARCHING CUBES
      # ============================================================

      - name: Verify Marching Cubes API
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import skimage
          from skimage import measure

          print("==========================================")
          print("MARCHING CUBES API CHECK")
          print("==========================================")

          print(
              "scikit-image:",
              skimage.__version__
          )

          print(
              "marching_cubes:",
              hasattr(
                  measure,
                  "marching_cubes"
              )
          )

          if not hasattr(
              measure,
              "marching_cubes"
          ):

              raise SystemExit(
                  "marching_cubes API unavailable"
              )

          print("")
          print(
              "Marching Cubes API is ready."
          )
          PY


      # ============================================================
      # PATCH DIAGNOSTICS
      # ============================================================

      - name: Patch Marching Cubes diagnostics
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/mesh_util.py"
          )

          text = path.read_text()

          old = """    except:
        print('error cannot marching cubes')
        return -1"""

          new = """    except Exception as e:
        print('')
        print('==========================================')
        print('MARCHING CUBES INTERNAL EXCEPTION')
        print('==========================================')
        print('Exception type:', type(e).__name__)
        print('Exception message:', str(e))
        print('')
        print('scikit-image version:')
        try:
            import skimage
            print(skimage.__version__)
        except Exception:
            print('Unable to determine scikit-image version')
        print('')
        print('FULL TRACEBACK')
        print('------------------------------------------')
        import traceback
        traceback.print_exc()
        print('==========================================')
        raise"""

          if old in text:

              text = text.replace(
                  old,
                  new,
                  1
              )

              path.write_text(
                  text
              )

              print(
                  "Diagnostic patch applied."
              )

          else:

              print(
                  "Diagnostic block not found."
              )
          PY


      # ============================================================
      # VERIFY MESH UTIL
      # ============================================================

      - name: Verify mesh_util.py
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "mesh_util.py CHECK"
          echo "=========================================="

          grep -n \
            "marching_cubes" \
            lib/mesh_util.py \
            || true

          echo ""
          echo "Relevant section:"
          sed -n \
            '65,115p' \
            lib/mesh_util.py


      # ============================================================
      # VERIFY DATASET
      # ============================================================

      - name: Verify teacher dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          input_dir = Path(
              "../teacher_input"
          )

          image = input_dir / "sample.jpg"
          rect = input_dir / "sample_rect.txt"

          print("==========================================")
          print("DATASET CHECK")
          print("==========================================")

          if not image.exists():
              raise SystemExit(
                  "sample.jpg is missing"
              )

          if not rect.exists():
              raise SystemExit(
                  "sample_rect.txt is missing"
              )

          print(
              "Image:",
              image
          )

          print(
              "Rectangle:",
              rect
          )

          print("")
          print(
              rect.read_text()
          )

          print("")
          print("Dataset OK.")
          PY


      # ============================================================
      # RUN REAL PIFUHDC
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input:"
          ls -lah ../teacher_input

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints

          echo ""
          echo "Starting inference..."
          echo ""

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect \
            2>&1 | tee ../teacher_output/pifuhdc.log

          PIFUHDC_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "PIFuHDC EXIT CODE"
          echo "=========================================="

          echo "$PIFUHDC_EXIT"

          echo ""
          echo "=========================================="
          echo "ALL OUTPUT FILES"
          echo "=========================================="

          find ../teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "OBJ FILES"
          echo "=========================================="

          find ../teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          OBJ_COUNT=$(find ../teacher_output \
            -type f \
            -iname "*.obj" \
            2>/dev/null | wc -l)

          echo ""
          echo "OBJ COUNT: $OBJ_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: NO OBJ GENERATED"
            echo "=========================================="

            echo ""
            echo "Full PIFuHDC log:"
            echo "------------------------------------------"

            cat ../teacher_output/pifuhdc.log

            echo "------------------------------------------"

            exit 1
          fi

          if [ "$PIFUHDC_EXIT" -ne 0 ]; then

            echo ""
            echo "PIFuHDC returned non-zero exit code."

            exit "$PIFUHDC_EXIT"

          fi

          echo ""
          echo "OBJ generated successfully."


      # ============================================================
      # VALIDATE OBJ
      # ============================================================

      - name: Validate generated OBJ
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          print("==========================================")
          print("OBJ VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print(
              "OBJ count:",
              len(objs)
          )

          if not objs:
              print("No OBJ generated.")
              raise SystemExit(0)

          for obj in objs:

              vertices = 0
              faces = 0
              colored_vertices = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):

                          vertices += 1

                          if len(
                              line.split()
                          ) >= 7:

                              colored_vertices += 1

                      elif line.startswith("f "):

                          faces += 1

              print("")
              print("File:", obj)
              print(
                  "Size:",
                  obj.stat().st_size,
                  "bytes"
              )

              print(
                  "Vertices:",
                  vertices
              )

              print(
                  "Faces:",
                  faces
              )

              print(
                  "Colored vertices:",
                  colored_vertices
              )

              if vertices == 0:
                  raise SystemExit(
                      "OBJ contains zero vertices."
                  )

              if faces == 0:
                  raise SystemExit(
                      "OBJ contains zero faces."
                  )

          print("")
          print("OBJ VALIDATION PASSED.")
          PY


      # ============================================================
      # CONVERT OBJ TO GLB
      # ============================================================

      - name: Convert OBJ to GLB
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          print("==========================================")
          print("OBJ -> GLB CONVERSION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:

              print("No OBJ found.")
              raise SystemExit(0)

          for obj in objs:

              print("")
              print("Loading:", obj)

              try:

                  mesh = trimesh.load(
                      obj,
                      force="mesh",
                      process=False
                  )

              except Exception as e:

                  print("")
                  print(
                      "Failed to load OBJ:"
                  )

                  print(
                      type(e).__name__,
                      str(e)
                  )

                  raise

              print(
                  "Vertices:",
                  len(mesh.vertices)
              )

              print(
                  "Faces:",
                  len(mesh.faces)
              )

              if len(mesh.vertices) == 0:

                  raise SystemExit(
                      "OBJ has no vertices."
                  )

              if len(mesh.faces) == 0:

                  raise SystemExit(
                      "OBJ has no faces."
                  )

              glb_path = obj.with_suffix(
                  ".glb"
              )

              print("")
              print(
                  "Exporting:",
                  glb_path
              )

              mesh.export(
                  glb_path,
                  file_type="glb"
              )

              if not glb_path.exists():

                  raise SystemExit(
                      "GLB file was not created."
                  )

              if glb_path.stat().st_size == 0:

                  raise SystemExit(
                      "GLB file is empty."
                  )

              print("")
              print(
                  "GLB created successfully."
              )

              print(
                  "Size:",
                  glb_path.stat().st_size,
                  "bytes"
              )

          print("")
          print("==========================================")
          print("GLB CONVERSION COMPLETE")
          print("==========================================")


      # ============================================================
      # VALIDATE GLB
      # ============================================================

      - name: Validate GLB
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          print("==========================================")
          print("GLB VALIDATION")
          print("==========================================")

          glbs = list(
              Path("teacher_output").rglob("*.glb")
          )

          print(
              "GLB count:",
              len(glbs)
          )

          if not glbs:

              print(
                  "No GLB generated."
              )

              raise SystemExit(0)

          for glb in glbs:

              print("")
              print(
                  "File:",
                  glb
              )

              print(
                  "Size:",
                  glb.stat().st_size,
                  "bytes"
              )

              scene = trimesh.load(
                  glb,
                  force="scene"
              )

              print(
                  "Scene geometry:",
                  len(scene.geometry)
              )

              if len(scene.geometry) == 0:

                  raise SystemExit(
                      "GLB contains no geometry."
                  )

          print("")
          print(
              "GLB VALIDATION PASSED."
          )


      # ============================================================
      # SEARCH ALL GENERATED FILES
      # ============================================================

      - name: Search generated files
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED FILES"
          echo "=========================================="

          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null \
            | sort

          echo ""
          echo "OBJ:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "GLB:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PNG:"
          find teacher_output \
            -type f \
            -iname "*.png" \
            -print \
            2>/dev/null || true


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload teacher results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-results
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/apps/recon.py
            pifuhdc/apps/test_colorHD.py
            pifuhdc/lib/mesh_util.py
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "PIFuHDC TEACHER VALIDATION SUMMARY"
          echo "=========================================="

          echo ""
          echo "Input:"
          find teacher_input \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "Output:"
          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "OBJ count:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            2>/dev/null \
            | wc -l

          echo ""
          echo "GLB count:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            2>/dev/null \
            | wc -l

          echo ""
          echo "=========================================="
          echo "END"
          echo "=========================================="
