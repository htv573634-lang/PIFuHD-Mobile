name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pifuhdc-teacher:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2


      # ============================================================
      # ENVIRONMENT CHECK
      # ============================================================

      - name: Check environment
        run: |
          python - <<'PY'
          import sys
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL

          print("==========================================")
          print("ENVIRONMENT")
          print("==========================================")

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)

          print("")
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              print(
                  "GPU:",
                  torch.cuda.get_device_name(0)
              )

          print("")
          print("Environment OK.")
          PY


      # ============================================================
      # CLONE OFFICIAL PIFUHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo ""
          echo "PIFuHDC repository:"
          find pifuhdc \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200


      # ============================================================
      # CHECKPOINT DIRECTORY
      # ============================================================

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "Checkpoint directory:"
          ls -lah checkpoints


      # ============================================================
      # DOWNLOAD GEOMETRY CHECKPOINT
      # ============================================================

      - name: Download PIFuHD geometry checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING GEOMETRY TEACHER"
          echo "=========================================="

          wget \
            --show-progress \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
            -O checkpoints/pifuhd.pt

          test -s checkpoints/pifuhd.pt

          echo ""
          ls -lh checkpoints/pifuhd.pt


      # ============================================================
      # DOWNLOAD COLOR CHECKPOINT
      # ============================================================

      - name: Download PIFuHDC color checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING COLOR TEACHER"
          echo "=========================================="

          gdown \
            1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
            -O checkpoints/net_C_HD.pt

          test -s checkpoints/net_C_HD.pt

          echo ""
          ls -lh checkpoints/net_C_HD.pt


      # ============================================================
      # VERIFY CHECKPOINTS
      # ============================================================

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINTS"
          echo "=========================================="

          ls -lah checkpoints

          echo ""
          echo "Geometry:"
          du -h checkpoints/pifuhd.pt

          echo ""
          echo "Color:"
          du -h checkpoints/net_C_HD.pt


      # ============================================================
      # PREPARE OFFICIAL SAMPLE IMAGE
      # ============================================================

      - name: Prepare teacher input
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "=========================================="
          echo "DOWNLOADING OFFICIAL SAMPLE"
          echo "=========================================="

          wget \
            --show-progress \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg \
            -O teacher_input/sample.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "teacher_input/sample.jpg"
          )

          image = Image.open(
              image_path
          )

          width, height = image.size

          print("")
          print("==========================================")
          print("INPUT IMAGE")
          print("==========================================")

          print("Path:", image_path)
          print("Width:", width)
          print("Height:", height)
          print("Mode:", image.mode)

          image.verify()

          rect = Path(
              "teacher_input/sample_rect.txt"
          )

          rect.write_text(
              f"0 0 {width} {height}\n"
          )

          print("")
          print("Rectangle:")
          print(
              rect.read_text()
          )

          print("")
          print("Input image verified.")
          PY

          echo ""
          echo "Input files:"
          ls -lah teacher_input


      # ============================================================
      # VERIFY PIFUHDC MODULES
      #
      # DO NOT import apps.test_colorHD because it runs inference
      # during import.
      # ============================================================

      - name: Verify PIFuHDC modules
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(
              0,
              "."
          )

          print("==========================================")
          print("PIFuHDC MODULE TEST")
          print("==========================================")

          import lib
          import lib.mesh_util
          import lib.options
          import apps
          import apps.recon

          print("lib: OK")
          print("lib.mesh_util: OK")
          print("lib.options: OK")
          print("apps: OK")
          print("apps.recon: OK")

          print("")
          print("PIFuHDC modules loaded successfully.")
          PY


      # ============================================================
      # CONFIGURE COLOR CHECKPOINT
      # ============================================================

      - name: Configure recon.py color checkpoint
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "apps/recon.py"
          )

          text = path.read_text()

          print("==========================================")
          print("CONFIGURING COLOR CHECKPOINT")
          print("==========================================")

          old = "checkpoints/net_C_choice2.pt"
          new = "checkpoints/net_C_HD.pt"

          if old in text:

              text = text.replace(
                  old,
                  new
              )

              path.write_text(
                  text
              )

              print("Changed:")
              print(old)
              print("")
              print("To:")
              print(new)

          else:

              print(
                  "Default color checkpoint reference not found."
              )

              print("")
              print(
                  "Searching recon.py:"
              )

              for number, line in enumerate(
                  text.splitlines(),
                  1
              ):

                  lower = line.lower()

                  if (
                      "net_c_" in lower
                      or
                      "ckpt_path_color" in lower
                  ):

                      print(
                          f"{number}: {line}"
                      )

              print("")
              print(
                  "No replacement performed."
              )
          PY


      # ============================================================
      # PATCH MARCHING CUBES
      #
      # IMPORTANT:
      #
      # This patches the CLONED official file:
      #
      # pifuhdc/lib/mesh_util.py
      #
      # It does NOT create this file in the user's repository.
      # ============================================================

      - name: Patch Marching Cubes diagnostics
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/mesh_util.py"
          )

          print("==========================================")
          print("MARCHING CUBES PATCH")
          print("==========================================")

          if not path.exists():

              raise SystemExit(
                  "ERROR: lib/mesh_util.py was not found"
              )

          text = path.read_text()

          print("File:", path)
          print(
              "Original size:",
              len(text),
              "bytes"
          )

          old_lines = [
              "    except:",
              "        print('error cannot marching cubes')",
              "        return -1",
          ]

          old = "\n".join(
              old_lines
          )

          new_lines = [
              "    except Exception as e:",
              "        print('')",
              "        print('==========================================')",
              "        print('MARCHING CUBES INTERNAL EXCEPTION')",
              "        print('==========================================')",
              "        print('Exception type:', type(e).__name__)",
              "        print('Exception message:', str(e))",
              "        print('')",
              "        print('scikit-image version:')",
              "        try:",
              "            import skimage",
              "            print(skimage.__version__)",
              "        except Exception:",
              "            print('Unable to determine scikit-image version')",
              "        print('')",
              "        print('FULL TRACEBACK')",
              "        print('------------------------------------------')",
              "        import traceback",
              "        traceback.print_exc()",
              "        print('==========================================')",
              "        raise",
          ]

          new = "\n".join(
              new_lines
          )

          if old not in text:

              print("")
              print(
                  "Expected Marching Cubes exception block "
                  "was not found."
              )

              print("")
              print(
                  "Searching mesh_util.py for relevant lines:"
              )

              lines = text.splitlines()

              for number, line in enumerate(
                  lines,
                  1
              ):

                  lower = line.lower()

                  if (
                      "marching" in lower
                      or
                      "marching_cubes" in lower
                      or
                      "cannot marching" in lower
                      or
                      line.strip() == "except:"
                  ):

                      start = max(
                          1,
                          number - 4
                      )

                      end = min(
                          len(lines),
                          number + 6
                      )

                      print("")
                      print(
                          f"--- lines {start}-{end} ---"
                      )

                      for i in range(
                          start,
                          end + 1
                      ):

                          print(
                              f"{i}: {lines[i - 1]}"
                          )

              raise SystemExit(
                  "Marching Cubes patch stopped safely."
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text
          )

          print("")
          print(
              "Marching Cubes diagnostic patch applied successfully."
          )

          print(
              "New size:",
              len(text),
              "bytes"
          )
          PY


      # ============================================================
      # VERIFY MARCHING CUBES PATCH
      # ============================================================

      - name: Verify Marching Cubes patch
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "VERIFYING MARCHING CUBES PATCH"
          echo "=========================================="

          grep -n \
            -A30 \
            "MARCHING CUBES INTERNAL EXCEPTION" \
            lib/mesh_util.py

          echo ""
          echo "Patch verification complete."


      # ============================================================
      # VERIFY DATASET
      # ============================================================

      - name: Verify teacher dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          input_dir = Path(
              "../teacher_input"
          )

          image = input_dir / "sample.jpg"
          rect = input_dir / "sample_rect.txt"

          print("==========================================")
          print("DATASET CHECK")
          print("==========================================")

          print(
              "Image:",
              image.exists()
          )

          print(
              "Rectangle:",
              rect.exists()
          )

          if not image.exists():

              raise SystemExit(
                  "sample.jpg is missing"
              )

          if not rect.exists():

              raise SystemExit(
                  "sample_rect.txt is missing"
              )

          print("")
          print("Rectangle contents:")
          print(
              rect.read_text()
          )

          print("")
          print("Dataset OK.")
          PY


      # ============================================================
      # RUN REAL PIFUHDC
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input files:"
          ls -lah ../teacher_input

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints

          echo ""
          echo "Starting inference..."
          echo ""

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect \
            2>&1 | tee ../teacher_output/pifuhdc.log

          PIFUHDC_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "PIFuHDC EXIT CODE"
          echo "=========================================="

          echo "$PIFUHDC_EXIT"

          echo ""
          echo "=========================================="
          echo "ALL OUTPUT FILES"
          echo "=========================================="

          find ../teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "OBJ FILES"
          echo "=========================================="

          find ../teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "PNG FILES"
          echo "=========================================="

          find ../teacher_output \
            -type f \
            -iname "*.png" \
            -print \
            2>/dev/null || true

          OBJ_COUNT=$(find ../teacher_output \
            -type f \
            -iname "*.obj" \
            2>/dev/null | wc -l)

          echo ""
          echo "OBJ COUNT: $OBJ_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: NO OBJ GENERATED"
            echo "=========================================="

            echo ""
            echo "PIFuHDC did not produce a mesh."

            echo ""
            echo "FULL PIFuHDC LOG:"
            echo "------------------------------------------"

            cat ../teacher_output/pifuhdc.log

            echo "------------------------------------------"
            echo ""

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "OBJ GENERATED SUCCESSFULLY"
          echo "=========================================="

          if [ "$PIFUHDC_EXIT" -ne 0 ]; then

            echo ""
            echo "PIFuHDC returned a non-zero exit code."

            exit "$PIFUHDC_EXIT"

          fi


      # ============================================================
      # INSPECT OUTPUT
      # ============================================================

      - name: Inspect teacher output
        if: always()
        run: |
          echo "=========================================="
          echo "TEACHER OUTPUT INSPECTION"
          echo "=========================================="

          if [ -d teacher_output ]; then

            find teacher_output \
              -type f \
              -printf "%p %s bytes\n" \
              | sort

          else

            echo "teacher_output does not exist."

          fi


      # ============================================================
      # SEARCH FOR MESHES
      # ============================================================

      - name: Search generated meshes
        if: always()
        run: |
          echo "=========================================="
          echo "SEARCHING GENERATED MESHES"
          echo "=========================================="

          echo ""
          echo "OBJ:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PLY:"
          find teacher_output \
            -type f \
            -iname "*.ply" \
            -print \
            2>/dev/null || true

          echo ""
          echo "GLB:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PNG:"
          find teacher_output \
            -type f \
            -iname "*.png" \
            -print \
            2>/dev/null || true


      # ============================================================
      # VALIDATE OBJ
      # ============================================================

      - name: Validate generated OBJ
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          print("==========================================")
          print("OBJ VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print(
              "OBJ count:",
              len(objs)
          )

          if not objs:

              print("")
              print(
                  "No OBJ generated."
              )

              raise SystemExit(0)

          for obj in objs:

              vertices = 0
              faces = 0
              colored_vertices = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):

                          vertices += 1

                          parts = line.split()

                          if len(parts) >= 7:

                              colored_vertices += 1

                      elif line.startswith("f "):

                          faces += 1

              print("")
              print(
                  "File:",
                  obj
              )

              print(
                  "Size:",
                  obj.stat().st_size,
                  "bytes"
              )

              print(
                  "Vertices:",
                  vertices
              )

              print(
                  "Faces:",
                  faces
              )

              print(
                  "Colored vertices:",
                  colored_vertices
              )

              if vertices == 0:

                  raise SystemExit(
                      "OBJ contains zero vertices."
                  )

              if faces == 0:

                  raise SystemExit(
                      "OBJ contains zero faces."
                  )

          print("")
          print(
              "OBJ VALIDATION PASSED."
          )


      # ============================================================
      # TRIMESH VALIDATION
      # ============================================================

      - name: Validate mesh with trimesh
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          print("==========================================")
          print("TRIMESH VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:

              print(
                  "No OBJ available."
              )

              raise SystemExit(0)

          for obj in objs:

              print("")
              print(
                  "Loading:",
                  obj
              )

              mesh = trimesh.load(
                  obj,
                  force="mesh",
                  process=False
              )

              print(
                  "Vertices:",
                  len(mesh.vertices)
              )

              print(
                  "Faces:",
                  len(mesh.faces)
              )

              print(
                  "Bounds:"
              )

              print(
                  mesh.bounds
              )

              if len(mesh.vertices) == 0:

                  raise SystemExit(
                      "Mesh contains no vertices."
                  )

              if len(mesh.faces) == 0:

                  raise SystemExit(
                      "Mesh contains no faces."
                  )

          print("")
          print(
              "TRIMESH VALIDATION PASSED."
          )


      # ============================================================
      # UPLOAD EVERYTHING IMPORTANT
      # ============================================================

      - name: Upload teacher results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-results
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/apps/recon.py
            pifuhdc/apps/test_colorHD.py
            pifuhdc/lib/mesh_util.py
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        run: |
          echo "=========================================="
          echo "PIFuHDC TEACHER VALIDATION SUMMARY"
          echo "=========================================="

          echo ""
          echo "Input files:"

          find teacher_input \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "Output files:"

          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "OBJ files:"

          find teacher_output \
            -type f \
            -iname "*.obj" \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "END"
          echo "=========================================="
