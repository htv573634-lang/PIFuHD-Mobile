name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:

jobs:
  teacher-validation:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg freeglut3-dev libgl1-mesa-dev libglu1-mesa-dev libglib2.0-0

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            opencv-python-headless \
            matplotlib \
            tqdm \
            gdown \
            scikit-image \
            trimesh \
            pyembree \
            PyOpenGL

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc
          git clone --depth 1 https://github.com/xiahongchi/PIFuHDC.git pifuhdc

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

      - name: Download PIFuHD teacher
        working-directory: pifuhdc
        run: |
          gdown 1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM -O checkpoints/pifuhd.pt

      - name: Download PIFuHDC color teacher
        working-directory: pifuhdc
        run: |
          if [ -f scripts/download_trained_model.sh ]; then
            bash scripts/download_trained_model.sh
          fi

          echo "Searching for color checkpoint..."

          find . -type f \( \
            -name "net_C_HD.pt" -o \
            -name "net_C_choice2.pt" -o \
            -name "net_C*.pt" \
          \) -print

          if [ -f checkpoints/net_C_HD.pt ]; then
            echo "Found net_C_HD.pt"
          elif [ -f checkpoints/net_C_choice2.pt ]; then
            echo "Found net_C_choice2.pt"
            cp checkpoints/net_C_choice2.pt checkpoints/net_C_HD.pt
          else
            echo "ERROR: PIFuHDC color checkpoint not found."
            find . -type f -name "*.pt" -print
            exit 1
          fi

          cp checkpoints/net_C_HD.pt checkpoints/net_C_choice2.pt

      - name: Verify teacher checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "TEACHER CHECKPOINTS"
          echo "=========================================="

          test -f checkpoints/pifuhd.pt
          test -f checkpoints/net_C_HD.pt
          test -f checkpoints/net_C_choice2.pt

          ls -lh checkpoints/pifuhd.pt
          ls -lh checkpoints/net_C_HD.pt
          ls -lh checkpoints/net_C_choice2.pt

      - name: Create project directories
        run: |
          rm -rf teacher_input teacher_output
          mkdir -p teacher_input
          mkdir -p teacher_output

      - name: Download sample image
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/sample_images/cxk.jpg','teacher_input/sample.jpg')"

      - name: Create rectangle metadata
        run: |
          python -c "from PIL import Image; im=Image.open('teacher_input/sample.jpg'); w,h=im.size; open('teacher_input/sample_rect.txt','w').write('0 0 %d %d\n' % (w,h)); print('Image:',w,'x',h); print('Rectangle: 0 0',w,h)"

      - name: Verify input
        run: |
          echo "=========================================="
          echo "TEACHER INPUT"
          echo "=========================================="

          ls -lh teacher_input/

          test -f teacher_input/sample.jpg
          test -f teacher_input/sample_rect.txt

      - name: Validate rectangle dataset
        working-directory: pifuhdc
        run: |
          python -c "from lib.data.EvalDataset import EvalDataset; O=type('O',(),{'dataroot':'../teacher_input','loadSize':1024}); d=EvalDataset(O()); print('EvalDataset length:',len(d)); assert len(d)==1; print('EvalDataset PASSED')"

      - name: Validate imports
        working-directory: pifuhdc
        run: |
          python -c "import torch,cv2,PIL,skimage,trimesh,matplotlib; print('PyTorch:',torch.__version__); print('OpenCV:',cv2.__version__); print('Pillow:',PIL.__version__); print('scikit-image:',skimage.__version__); print('trimesh:',trimesh.__version__); print('matplotlib:',matplotlib.__version__); print('Imports PASSED')"

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

      - name: Inspect teacher output
        run: |
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ ! -d teacher_output ]; then
            echo "ERROR: teacher_output does not exist"
            exit 1
          fi

          echo "All generated files:"
          find teacher_output -type f -print

          echo
          echo "Output size:"
          du -sh teacher_output

      - name: Validate OBJ mesh
        run: |
          echo "=========================================="
          echo "MESH VALIDATION"
          echo "=========================================="

          OBJ_COUNT=$(find teacher_output -type f -iname "*.obj" | wc -l)

          echo "OBJ count: $OBJ_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ]; then
            echo "ERROR: No OBJ mesh generated."
            echo
            echo "Searching entire workspace:"
            find . -type f \( -iname "*.obj" -o -iname "*.ply" \) -print
            exit 1
          fi

          for OBJ in $(find teacher_output -type f -iname "*.obj"); do
            echo
            echo "Mesh: $OBJ"

            VERTICES=$(grep -c '^v ' "$OBJ" || true)
            FACES=$(grep -c '^f ' "$OBJ" || true)
            UVS=$(grep -c '^vt ' "$OBJ" || true)
            NORMALS=$(grep -c '^vn ' "$OBJ" || true)

            echo "Vertices: $VERTICES"
            echo "Faces: $FACES"
            echo "UVs: $UVS"
            echo "Normals: $NORMALS"

            if [ "$VERTICES" -eq 0 ]; then
              echo "ERROR: Mesh has zero vertices."
              exit 1
            fi

            if [ "$FACES" -eq 0 ]; then
              echo "ERROR: Mesh has zero faces."
              exit 1
            fi

            echo "OBJ validation PASSED"
          done

      - name: Validate mesh with trimesh
        run: |
          python -c "import glob,trimesh; files=glob.glob('teacher_output/**/*.obj',recursive=True); print('OBJ files:',files); assert files,'No OBJ files found'; [(print('Loading:',p),print('Vertices:',len((m:=trimesh.load(p,force='mesh',process=False)).vertices)),print('Faces:',len(m.faces)),print('Bounds:',m.bounds),print('Trimesh validation PASSED')) for p in files]"

      - name: Create teacher report
        run: |
          echo "PIFuHDC REAL TEACHER VALIDATION" > teacher_report.txt
          echo "================================" >> teacher_report.txt
          echo "Teacher: PIFuHD + PIFuHDC Color" >> teacher_report.txt
          echo "Input: teacher_input/sample.jpg" >> teacher_report.txt
          echo "Mode: Rectangle" >> teacher_report.txt
          echo "Resolution: 256" >> teacher_report.txt
          echo "Output: teacher_output/" >> teacher_report.txt
          echo "Status: PASSED" >> teacher_report.txt

          cat teacher_report.txt

      - name: Upload teacher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-validation
          path: |
            teacher_input/
            teacher_output/
            teacher_report.txt
          if-no-files-found: error
