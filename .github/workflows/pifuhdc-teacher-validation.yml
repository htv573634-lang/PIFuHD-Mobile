name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pifuhdc-teacher:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1


      # ============================================================
      # PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            pyembree==0.1.12 \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2


      # ============================================================
      # ENVIRONMENT CHECK
      # ============================================================

      - name: Check environment
        run: |
          python - <<'PY'
          import sys
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL

          print("==========================================")
          print("ENVIRONMENT")
          print("==========================================")

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)

          print("")
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              print(
                  "GPU:",
                  torch.cuda.get_device_name(0)
              )

          print("")
          print("Environment OK.")
          PY


      # ============================================================
      # CLONE PIFUHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo ""
          echo "PIFuHDC repository:"
          find pifuhdc \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200


      # ============================================================
      # CHECKPOINT DIRECTORY
      # ============================================================

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "Checkpoint directory:"
          ls -lah checkpoints


      # ============================================================
      # DOWNLOAD GEOMETRY TEACHER
      # ============================================================

      - name: Download PIFuHD geometry checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING GEOMETRY TEACHER"
          echo "=========================================="

          wget \
            --show-progress \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
            -O checkpoints/pifuhd.pt

          test -s checkpoints/pifuhd.pt

          echo ""
          ls -lh checkpoints/pifuhd.pt


      # ============================================================
      # DOWNLOAD COLOR TEACHER
      # ============================================================

      - name: Download PIFuHDC color checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING COLOR TEACHER"
          echo "=========================================="

          gdown \
            1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
            -O checkpoints/net_C_HD.pt

          test -s checkpoints/net_C_HD.pt

          echo ""
          ls -lh checkpoints/net_C_HD.pt


      # ============================================================
      # VERIFY CHECKPOINTS
      # ============================================================

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINTS"
          echo "=========================================="

          ls -lah checkpoints

          echo ""
          echo "Geometry checkpoint:"
          du -h checkpoints/pifuhd.pt

          echo ""
          echo "Color checkpoint:"
          du -h checkpoints/net_C_HD.pt


      # ============================================================
      # PREPARE INPUT
      # ============================================================

      - name: Prepare teacher input
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "Downloading official PIFuHDC sample..."

          wget \
            --show-progress \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg \
            -O teacher_input/sample.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path(
              "teacher_input/sample.jpg"
          )

          image = Image.open(image_path)

          width, height = image.size

          print("==========================================")
          print("INPUT IMAGE")
          print("==========================================")

          print("Path:", image_path)
          print("Width:", width)
          print("Height:", height)
          print("Mode:", image.mode)

          image.verify()

          rect = Path(
              "teacher_input/sample_rect.txt"
          )

          rect.write_text(
              f"0 0 {width} {height}\n"
          )

          print("")
          print("Rectangle file:")
          print(rect.read_text())

          print("")
          print("Input OK.")
          PY

          echo ""
          ls -lah teacher_input


      # ============================================================
      # VERIFY PIFUHDC MODULES
      #
      # Do NOT import apps.test_colorHD.
      # It executes inference during import.
      # ============================================================

      - name: Verify PIFuHDC modules
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, ".")

          print("==========================================")
          print("PIFuHDC MODULE TEST")
          print("==========================================")

          import lib
          import lib.mesh_util
          import lib.options
          import apps
          import apps.recon

          print("lib: OK")
          print("mesh_util: OK")
          print("options: OK")
          print("apps: OK")
          print("recon: OK")

          print("")
          print("PIFuHDC modules loaded successfully.")
          PY


      # ============================================================
      # PATCH recon.py COLOR CHECKPOINT
      # ============================================================

      - name: Configure recon.py color checkpoint
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "apps/recon.py"
          )

          text = path.read_text()

          print("==========================================")
          print("PATCHING recon.py COLOR CHECKPOINT")
          print("==========================================")

          old = "checkpoints/net_C_choice2.pt"

          if old in text:

              text = text.replace(
                  old,
                  "checkpoints/net_C_HD.pt"
              )

              path.write_text(text)

              print("Changed:")
              print(old)
              print("")
              print("To:")
              print("checkpoints/net_C_HD.pt")

          else:

              print(
                  "net_C_choice2.pt not found."
              )

              print("")
              print(
                  "Existing color references:"
              )

              for number, line in enumerate(
                  text.splitlines(),
                  1
              ):

                  if (
                      "net_C_" in line
                      or
                      "ckpt_path_Color" in line
                      or
                      "state_dict_path_Color" in line
                  ):

                      print(
                          f"{number}: {line}"
                      )

              print("")
              print(
                  "This may already be configured."
              )
          PY


      # ============================================================
      # PATCH MARCHING CUBES
      #
      # IMPORTANT:
      # This modifies the CLONED official file:
      #
      # pifuhdc/lib/mesh_util.py
      #
      # It does NOT create a mesh_util.py in our repository.
      # ============================================================

      - name: Patch Marching Cubes diagnostics
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "lib/mesh_util.py"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: pifuhdc/lib/mesh_util.py not found"
              )

          text = path.read_text()

          print("==========================================")
          print("MARCHING CUBES PATCH")
          print("==========================================")

          print(
              "File:",
              path
          )

          print(
              "Original size:",
              len(text),
              "bytes"
          )

          old = """    except:
        print('error cannot marching cubes')
        return -1"""

          new = """    except Exception as e:
        print('')
        print('==========================================')
        print('MARCHING CUBES INTERNAL EXCEPTION')
        print('==========================================')
        print('Exception type:', type(e).__name__)
        print('Exception message:', str(e))
        print('')
        print('scikit-image version:')
        try:
            import skimage
            print(skimage.__version__)
        except Exception:
            print('Unable to determine scikit-image version')
        print('')
        print('FULL TRACEBACK')
        print('------------------------------------------')
        import traceback
        traceback.print_exc()
        print('==========================================')
        raise"""

          if old not in text:

              print("")
              print(
                  "Expected exception block was not found."
              )

              print("")
              print(
                  "Searching for Marching Cubes code:"
              )

              lines = text.splitlines()

              for number, line in enumerate(
                  lines,
                  1
              ):

                  lower = line.lower()

                  if (
                      "marching" in lower
                      or
                      "marching_cubes" in lower
                      or
                      "cannot marching" in lower
                      or
                      "except:" in lower
                  ):

                      start = max(
                          1,
                          number - 3
                      )

                      end = min(
                          len(lines),
                          number + 5
                      )

                      print(
                          f"\n--- lines {start}-{end} ---"
                      )

                      for i in range(
                          start,
                          end + 1
                      ):

                          print(
                              f"{i}: {lines[i-1]}"
                          )

              raise SystemExit(
                  "Patch stopped safely."
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(text)

          print("")
          print(
              "Marching Cubes diagnostic patch applied."
          )

          print(
              "New size:",
              len(text),
              "bytes"
          )
          PY


      # ============================================================
      # SHOW PATCHED FILE
      # ============================================================

      - name: Verify patched mesh_util.py
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "PATCHED mesh_util.py"
          echo "=========================================="

          grep -n \
            -A25 \
            "MARCHING CUBES INTERNAL EXCEPTION" \
            lib/mesh_util.py

          echo ""
          echo "Patch verification complete."


      # ============================================================
      # VERIFY DATASET
      # ============================================================

      - name: Verify teacher dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          input_dir = Path(
              "../teacher_input"
          )

          print("==========================================")
          print("DATASET")
          print("==========================================")

          image = input_dir / "sample.jpg"
          rect = input_dir / "sample_rect.txt"

          print(
              "Image exists:",
              image.exists()
          )

          print(
              "Rect exists:",
              rect.exists()
          )

          if not image.exists():
              raise SystemExit(
                  "sample.jpg missing"
              )

          if not rect.exists():
              raise SystemExit(
                  "sample_rect.txt missing"
              )

          print("")
          print("Rect contents:")
          print(rect.read_text())

          print("")
          print("Dataset OK.")
          PY


      # ============================================================
      # RUN REAL PIFUHDC
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        shell: bash
        run: |
          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input:"
          ls -lah ../teacher_input

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints

          echo ""
          echo "Starting inference..."
          echo ""

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect


      # ============================================================
      # OUTPUT INSPECTION
      # ============================================================

      - name: Inspect teacher output
        if: always()
        run: |
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ -d teacher_output ]; then

            find teacher_output \
              -type f \
              -printf "%p %s bytes\n" \
              | sort

          else

            echo "teacher_output does not exist."

          fi


      # ============================================================
      # SEARCH FOR MESH
      # ============================================================

      - name: Search generated mesh
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED MESHES"
          echo "=========================================="

          echo ""
          echo "OBJ:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PLY:"
          find teacher_output \
            -type f \
            -iname "*.ply" \
            -print \
            2>/dev/null || true

          echo ""
          echo "GLB:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            -print \
            2>/dev/null || true


      # ============================================================
      # VALIDATE OBJ
      # ============================================================

      - name: Validate generated OBJ
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          print("==========================================")
          print("OBJ VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print(
              "OBJ count:",
              len(objs)
          )

          if not objs:
              print("")
              print("No OBJ generated.")
              raise SystemExit(0)

          for obj in objs:

              vertices = 0
              faces = 0
              colored = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):

                          vertices += 1

                          if len(line.split()) >= 7:
                              colored += 1

                      elif line.startswith("f "):

                          faces += 1

              print("")
              print("File:", obj)
              print(
                  "Size:",
                  obj.stat().st_size
              )
              print(
                  "Vertices:",
                  vertices
              )
              print(
                  "Faces:",
                  faces
              )
              print(
                  "Colored vertices:",
                  colored
              )

              if vertices == 0:
                  raise SystemExit(
                      "OBJ has zero vertices."
                  )

              if faces == 0:
                  raise SystemExit(
                      "OBJ has zero faces."
                  )

          print("")
          print(
              "OBJ VALIDATION PASSED."
          )


      # ============================================================
      # TRIMESH VALIDATION
      # ============================================================

      - name: Validate mesh with trimesh
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          print("==========================================")
          print("TRIMESH VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:

              print(
                  "No OBJ to validate."
              )

              raise SystemExit(0)

          for obj in objs:

              print("")
              print(
                  "Loading:",
                  obj
              )

              mesh = trimesh.load(
                  obj,
                  force="mesh",
                  process=False
              )

              print(
                  "Vertices:",
                  len(mesh.vertices)
              )

              print(
                  "Faces:",
                  len(mesh.faces)
              )

              print("")
              print("Bounds:")
              print(mesh.bounds)

              if len(mesh.vertices) == 0:
                  raise SystemExit(
                      "Mesh has no vertices."
                  )

              if len(mesh.faces) == 0:
                  raise SystemExit(
                      "Mesh has no faces."
                  )

          print("")
          print(
              "TRIMESH VALIDATION PASSED."
          )


      # ============================================================
      # UPLOAD RESULTS
      # ============================================================

      - name: Upload teacher results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-results
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/apps/recon.py
            pifuhdc/apps/test_colorHD.py
            pifuhdc/lib/mesh_util.py
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Final summary
        if: always()
        run: |
          echo "=========================================="
          echo "PIFuHDC TEACHER VALIDATION"
          echo "=========================================="

          echo ""
          echo "Input files:"
          find teacher_input \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "Output files:"
          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "END"
          echo "=========================================="
