name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:

jobs:
  teacher-validation:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglib2.0-0

      - name: Install Python packages
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            opencv-python-headless \
            matplotlib \
            tqdm \
            gdown \
            scikit-image \
            trimesh \
            pyembree \
            PyOpenGL

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Clone official PIFuHDC
        run: |
          set -e

          rm -rf pifuhdc

          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          test -d pifuhdc

      - name: Inspect official reconstruction code
        run: |
          set -e

          echo "=========================================="
          echo "PIFuHDC REPOSITORY STRUCTURE"
          echo "=========================================="

          find pifuhdc \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300

          echo ""
          echo "=========================================="
          echo "test_colorHD.py"
          echo "=========================================="

          sed -n '1,260p' pifuhdc/apps/test_colorHD.py

          echo ""
          echo "=========================================="
          echo "recon.py OUTPUT REFERENCES"
          echo "=========================================="

          grep -nEi \
            "results_path|results|save|obj|mesh|write|export" \
            pifuhdc/apps/recon.py \
            | head -200 || true

      - name: Prepare directories
        run: |
          set -e

          mkdir -p pifuhdc/checkpoints
          mkdir -p teacher_input
          mkdir -p teacher_output
          mkdir -p diagnostic_output

      - name: Download PIFuHD geometry teacher
        working-directory: pifuhdc
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING PIFuHD GEOMETRY TEACHER"
          echo "=========================================="

          wget \
            "https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt" \
            -O checkpoints/pifuhd.pt

          test -s checkpoints/pifuhd.pt

          SIZE=$(stat -c%s checkpoints/pifuhd.pt)

          echo "PIFuHD size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000000 ]; then
            echo "ERROR: PIFuHD checkpoint is too small."
            exit 1
          fi

          ls -lh checkpoints/pifuhd.pt

      - name: Download PIFuHDC color teacher
        working-directory: pifuhdc
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING PIFuHDC COLOR TEACHER"
          echo "=========================================="

          gdown \
            1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
            -O checkpoints/net_C_HD.pt

          test -s checkpoints/net_C_HD.pt

          SIZE=$(stat -c%s checkpoints/net_C_HD.pt)

          echo "Color checkpoint size: $SIZE bytes"

          if [ "$SIZE" -lt 20000000 ]; then
            echo "ERROR: Color checkpoint is unexpectedly small."
            exit 1
          fi

          cp checkpoints/net_C_HD.pt \
             checkpoints/net_C_choice2.pt

          ls -lh checkpoints/net_C_HD.pt
          ls -lh checkpoints/net_C_choice2.pt

      - name: Verify teacher checkpoints
        working-directory: pifuhdc
        run: |
          set -e

          echo "=========================================="
          echo "CHECKPOINT VALIDATION"
          echo "=========================================="

          test -f checkpoints/pifuhd.pt
          test -f checkpoints/net_C_HD.pt
          test -f checkpoints/net_C_choice2.pt

          ls -lh checkpoints/pifuhd.pt
          ls -lh checkpoints/net_C_HD.pt
          ls -lh checkpoints/net_C_choice2.pt

          echo ""
          echo "SHA256:"
          sha256sum \
            checkpoints/pifuhd.pt \
            checkpoints/net_C_HD.pt \
            checkpoints/net_C_choice2.pt

      - name: Download official PIFuHDC sample image
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING OFFICIAL PIFuHDC SAMPLE"
          echo "=========================================="

          wget \
            "https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg" \
            -O teacher_input/sample.jpg

          test -s teacher_input/sample.jpg

          file teacher_input/sample.jpg
          ls -lh teacher_input/sample.jpg

      - name: Validate sample image
        run: |
          set -e

          python -c "from PIL import Image; im=Image.open('teacher_input/sample.jpg'); print('Format:',im.format); print('Size:',im.size); print('Mode:',im.mode); im.verify(); print('IMAGE VALIDATION PASSED')"

      - name: Create rectangle metadata
        run: |
          set -e

          python -c "from PIL import Image; im=Image.open('teacher_input/sample.jpg'); w,h=im.size; open('teacher_input/sample_rect.txt','w').write('0 0 %d %d\n' % (w,h)); print('Image size:',w,'x',h); print('Rectangle:',0,0,w,h)"

          cat teacher_input/sample_rect.txt

      - name: Validate EvalDataset
        working-directory: pifuhdc
        run: |
          set -e

          python -c "from lib.data.EvalDataset import EvalDataset; O=type('Opt',(),{'dataroot':'../teacher_input','loadSize':1024}); d=EvalDataset(O()); print('Dataset length:',len(d)); assert len(d)==1; print('EvalDataset PASSED')"

      - name: Validate Python imports
        working-directory: pifuhdc
        run: |
          set -e

          python -c "import torch,cv2,PIL,skimage,trimesh,matplotlib; print('PyTorch:',torch.__version__); print('OpenCV:',cv2.__version__); print('Pillow:',PIL.__version__); print('scikit-image:',skimage.__version__); print('trimesh:',trimesh.__version__); print('matplotlib:',matplotlib.__version__); print('IMPORT VALIDATION PASSED')"

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          set +e

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

          EXIT_CODE=$?

          echo ""
          echo "PIFuHDC process exit code: $EXIT_CODE"

          exit 0

      - name: Search all generated files
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "SEARCHING ENTIRE WORKSPACE"
          echo "=========================================="

          echo ""
          echo "OBJ FILES:"
          find . \
            -type f \
            -iname "*.obj" \
            -print

          echo ""
          echo "PLY FILES:"
          find . \
            -type f \
            -iname "*.ply" \
            -print

          echo ""
          echo "PNG FILES:"
          find . \
            -type f \
            -iname "*.png" \
            -print

          echo ""
          echo "JPG FILES:"
          find . \
            -type f \
            -iname "*.jpg" \
            -print

          echo ""
          echo "ALL FILES IN teacher_output:"
          find teacher_output \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "ALL FILES IN pifuhdc/results:"
          find pifuhdc/results \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "ALL DIRECTORIES:"
          find . \
            -maxdepth 4 \
            -type d \
            | sort

      - name: Collect generated meshes
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "COLLECTING GENERATED MESHES"
          echo "=========================================="

          mkdir -p teacher_output

          FOUND=0

          while IFS= read -r FILE; do

            if [ -f "$FILE" ]; then

              case "$FILE" in
                ./teacher_output/*)
                  ;;
                *)
                  echo "Found mesh:"
                  echo "$FILE"

                  cp "$FILE" \
                    "teacher_output/$(basename "$FILE")"

                  FOUND=$((FOUND + 1))
                  ;;
              esac

            fi

          done < <(
            find . \
              -type f \
              \( -iname "*.obj" -o -iname "*.ply" \) \
              -print
          )

          echo ""
          echo "Meshes collected: $FOUND"

          find teacher_output \
            -type f \
            -print

      - name: Validate OBJ mesh
        run: |
          set -e

          echo "=========================================="
          echo "MESH VALIDATION"
          echo "=========================================="

          OBJ_COUNT=$(find teacher_output -type f -iname "*.obj" | wc -l)

          echo "OBJ count: $OBJ_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR: No OBJ mesh generated."

            echo ""
            echo "This means the PIFuHDC inference stage did not produce"
            echo "an OBJ in the expected locations."

            echo ""
            echo "The previous diagnostic step has searched the"
            echo "entire workspace."

            exit 1
          fi

          while IFS= read -r OBJ; do

            echo ""
            echo "------------------------------------------"
            echo "MESH: $OBJ"
            echo "------------------------------------------"

            VERTICES=$(grep -c '^v ' "$OBJ" || true)
            FACES=$(grep -c '^f ' "$OBJ" || true)
            UVS=$(grep -c '^vt ' "$OBJ" || true)
            NORMALS=$(grep -c '^vn ' "$OBJ" || true)

            echo "Vertices: $VERTICES"
            echo "Faces:    $FACES"
            echo "UVs:      $UVS"
            echo "Normals:  $NORMALS"

            if [ "$VERTICES" -eq 0 ]; then
              echo "ERROR: Mesh has zero vertices."
              exit 1
            fi

            if [ "$FACES" -eq 0 ]; then
              echo "ERROR: Mesh has zero faces."
              exit 1
            fi

            echo "OBJ VALIDATION PASSED"

          done < <(find teacher_output -type f -iname "*.obj")

      - name: Validate mesh with trimesh
        run: |
          set -e

          echo "=========================================="
          echo "TRIMESH VALIDATION"
          echo "=========================================="

          python -c "import glob,trimesh; files=glob.glob('teacher_output/**/*.obj',recursive=True); print('OBJ files:',files); assert files,'No OBJ files found'; [(print('Loading:',p),print('Vertices:',len((m:=trimesh.load(p,force='mesh',process=False)).vertices)),print('Faces:',len(m.faces)),print('Bounds:',m.bounds),print('TRIMESH VALIDATION PASSED')) for p in files]"

      - name: Create diagnostic report
        if: always()
        run: |
          set +e

          echo "PIFuHDC TEACHER DIAGNOSTIC REPORT" \
            > diagnostic_output/report.txt

          echo "=================================" \
            >> diagnostic_output/report.txt

          echo "" >> diagnostic_output/report.txt

          echo "Workspace OBJ files:" \
            >> diagnostic_output/report.txt

          find . \
            -type f \
            -iname "*.obj" \
            -print \
            >> diagnostic_output/report.txt

          echo "" >> diagnostic_output/report.txt

          echo "Workspace PLY files:" \
            >> diagnostic_output/report.txt

          find . \
            -type f \
            -iname "*.ply" \
            -print \
            >> diagnostic_output/report.txt

          echo "" >> diagnostic_output/report.txt

          echo "teacher_output contents:" \
            >> diagnostic_output/report.txt

          find teacher_output \
            -type f \
            -print \
            >> diagnostic_output/report.txt

          echo "" >> diagnostic_output/report.txt

          echo "PIFuHDC results contents:" \
            >> diagnostic_output/report.txt

          find pifuhdc/results \
            -type f \
            -print \
            >> diagnostic_output/report.txt 2>/dev/null || true

          cat diagnostic_output/report.txt

      - name: Upload teacher artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-validation
          path: |
            teacher_input/
            teacher_output/
            diagnostic_output/
            pifuhdc/results/
          if-no-files-found: warn
