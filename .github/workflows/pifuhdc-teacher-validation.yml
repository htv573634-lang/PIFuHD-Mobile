name: Step 4A - Real PIFuHDC Teacher Validation

on:
  workflow_dispatch:

jobs:
  teacher-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0 \
            ffmpeg


      # ============================================================
      # 4. PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            tqdm \
            gdown \
            trimesh \
            pyembree

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu


      # ============================================================
      # 5. VERIFY PYTHON ENVIRONMENT
      # ============================================================

      - name: Verify Python dependencies
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import PIL
          import cv2
          import matplotlib
          import trimesh

          print()
          print("==========================================")
          print("PYTHON ENVIRONMENT")
          print("==========================================")

          print("Python dependencies loaded successfully.")

          print()
          print("Torch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("OpenCV:", cv2.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Trimesh:", trimesh.__version__)

          print()
          print("Environment check passed.")
          PY


      # ============================================================
      # 6. CLONE OFFICIAL PIFuHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc


      # ============================================================
      # 7. PREPARE CHECKPOINTS
      # ============================================================

      - name: Prepare checkpoints
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt


      # ============================================================
      # 8. DOWNLOAD PIFuHD TEACHER
      # ============================================================

      - name: Download PIFuHD teacher
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt


      # ============================================================
      # 9. DOWNLOAD PIFuHDC COLOR TEACHER
      # ============================================================

      - name: Download PIFuHDC color teacher
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt


      # ============================================================
      # 10. VERIFY TEACHER CHECKPOINTS
      # ============================================================

      - name: Verify teacher checkpoints
        run: |
          python - <<'PY'
          import os

          files = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt"
          ]

          print()
          print("==========================================")
          print("PIFuHDC TEACHER CHECKPOINTS")
          print("==========================================")

          total = 0

          for path in files:

              if not os.path.exists(path):
                  raise RuntimeError(
                      "Missing checkpoint: " + path
                  )

              size = os.path.getsize(path)
              total += size

              print()
              print("File:", path)
              print("Bytes:", size)
              print(
                  "MB:",
                  round(
                      size / 1024 / 1024,
                      2
                  )
              )

          print()
          print(
              "Total teacher size MB:",
              round(
                  total / 1024 / 1024,
                  2
              )
          )

          print()
          print("Teacher checkpoints verified.")
          PY


      # ============================================================
      # 11. PREPARE INPUT / OUTPUT
      # ============================================================

      - name: Prepare directories
        run: |
          mkdir -p teacher_input
          mkdir -p teacher_output
          mkdir -p reports


      # ============================================================
      # 12. DOWNLOAD OFFICIAL SAMPLE
      # ============================================================

      - name: Prepare official sample image
        run: |
          wget \
            -O teacher_input/sample.jpg \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg

          echo
          echo "=========================================="
          echo "INPUT IMAGE"
          echo "=========================================="

          ls -lh teacher_input/


      # ============================================================
      # 13. INSPECT INPUT
      # ============================================================

      - name: Inspect input image
        run: |
          python - <<'PY'
          from PIL import Image

          path = "teacher_input/sample.jpg"

          image = Image.open(path)

          print()
          print("==========================================")
          print("IMAGE INFORMATION")
          print("==========================================")

          print("Format:", image.format)
          print("Size:", image.size)
          print("Mode:", image.mode)

          print()
          print("Input image loaded successfully.")
          PY


      # ============================================================
      # 14. VERIFY PIFuHDC IMPORTS
      # ============================================================

      - name: Verify PIFuHDC imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import apps.test_colorHD
          import apps.recon

          print()
          print("==========================================")
          print("PIFuHDC IMPORT TEST")
          print("==========================================")

          print("test_colorHD import: OK")
          print("recon import: OK")
          print()
          print("PIFuHDC Python modules loaded.")
          PY


      # ============================================================
      # 15. RUN REAL PIFuHDC
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |

          echo
          echo "=========================================="
          echo "REAL PIFuHDC TEACHER INFERENCE"
          echo "=========================================="

          echo
          echo "Input:"
          echo "../teacher_input"

          echo
          echo "Output:"
          echo "../teacher_output"

          echo
          echo "Geometry teacher:"
          echo "pifuhd.pt"

          echo
          echo "Color teacher:"
          echo "net_C_HD.pt"

          echo
          echo "Starting inference..."
          echo

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256


      # ============================================================
      # 16. SHOW OUTPUT
      # ============================================================

      - name: Inspect teacher output
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ -d "teacher_output" ]; then
            find teacher_output \
              -maxdepth 6 \
              -type f \
              -printf "%p %s bytes\n" \
              | sort
          else
            echo "teacher_output directory does not exist."
          fi


      # ============================================================
      # 17. VALIDATE MESH
      # ============================================================

      - name: Validate generated mesh
        if: success()
        run: |
          python - <<'PY'
          import glob
          import os

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("MESH VALIDATION")
          print("==========================================")

          if not paths:
              raise RuntimeError(
                  "PIFuHDC completed but no OBJ mesh was found."
              )

          for path in paths:

              size = os.path.getsize(path)

              print()
              print("OBJ:", path)
              print("Bytes:", size)

              if size == 0:
                  raise RuntimeError(
                      "Generated OBJ is empty: " + path
                  )

          print()
          print("REAL 3D MESH GENERATED SUCCESSFULLY.")
          PY


      # ============================================================
      # 18. ANALYZE MESH
      # ============================================================

      - name: Analyze mesh
        if: success()
        run: |
          python - <<'PY'
          import glob

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("PIFuHDC MESH ANALYSIS")
          print("==========================================")

          for path in paths:

              vertices = 0
              faces = 0
              vertex_colors = 0

              with open(
                  path,
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):
                          vertices += 1

                      elif line.startswith("f "):
                          faces += 1

                      elif line.startswith("vc "):
                          vertex_colors += 1

              print()
              print("File:", path)
              print("Vertices:", vertices)
              print("Faces:", faces)
              print(
                  "Vertex colors:",
                  vertex_colors
              )

          print()
          print("Mesh analysis completed.")
          PY


      # ============================================================
      # 19. CREATE REPORT
      # ============================================================

      - name: Create teacher report
        if: always()
        run: |
          {
            echo "REAL PIFuHDC TEACHER VALIDATION"
            echo "================================"
            echo
            echo "Teacher:"
            echo "PIFuHD + PIFuHDC Color"
            echo
            echo "Input:"
            echo "Official PIFuHDC sample"
            echo
            echo "Resolution:"
            echo "256"
            echo
            echo "Checkpoints:"
            ls -lh pifuhdc/checkpoints/
            echo
            echo "Output:"
            find teacher_output \
              -maxdepth 6 \
              -type f \
              -printf "%p %s bytes\n"
            echo
            echo "Purpose:"
            echo "Validate real PIFuHDC teacher output"
            echo "before building the production student."
          } > reports/teacher_validation.txt

          cat reports/teacher_validation.txt


      # ============================================================
      # 20. UPLOAD OUTPUT
      # ============================================================

      - name: Upload teacher validation artifact
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: pifuhdc-real-teacher-validation

          path: |
            teacher_output/
            reports/teacher_validation.txt

          if-no-files-found: warn

          retention-days: 7
