name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pifuhdc-teacher:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2

      - name: Check environment
        run: |
          python - <<'PY'
          import sys
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)
          print("CUDA:", torch.cuda.is_available())
          PY

      # ============================================================
      # CLONE OFFICIAL PIFuHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      # ============================================================
      # CHECKPOINTS
      # ============================================================

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints
          ls -lah checkpoints

      - name: Restore PIFuHDC checkpoint cache
        uses: actions/cache@v4
        with:
          path: pifuhdc/checkpoints
          key: pifuhdc-checkpoints-v1
          restore-keys: |
            pifuhdc-checkpoints-

      - name: Download PIFuHD geometry if needed
        working-directory: pifuhdc
        shell: bash
        run: |
          if [ -s checkpoints/pifuhd.pt ]; then
            echo "Geometry checkpoint found in cache."
          else
            echo "Geometry checkpoint not cached."
            echo "Downloading..."

            wget \
              --show-progress \
              https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
              -O checkpoints/pifuhd.pt
          fi

          test -s checkpoints/pifuhd.pt

          ls -lh checkpoints/pifuhd.pt

      - name: Download PIFuHDC color checkpoint if needed
        working-directory: pifuhdc
        shell: bash
        run: |
          if [ -s checkpoints/net_C_HD.pt ]; then
            echo "Color checkpoint found in cache."
          else
            echo "Color checkpoint not cached."
            echo "Downloading..."

            gdown \
              1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
              -O checkpoints/net_C_HD.pt
          fi

          test -s checkpoints/net_C_HD.pt

          ls -lh checkpoints/net_C_HD.pt

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          test -s checkpoints/pifuhd.pt
          test -s checkpoints/net_C_HD.pt

          echo "=========================================="
          echo "CHECKPOINTS READY"
          echo "=========================================="

          ls -lh checkpoints/pifuhd.pt
          ls -lh checkpoints/net_C_HD.pt

      # ============================================================
      # INPUT
      # ============================================================

      - name: Prepare teacher input
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          wget \
            --show-progress \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg \
            -O teacher_input/sample.jpg

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          image_path = Path("teacher_input/sample.jpg")

          image = Image.open(image_path)

          width, height = image.size

          print("Image:", image_path)
          print("Width:", width)
          print("Height:", height)

          image.verify()

          rect = Path("teacher_input/sample_rect.txt")

          rect.write_text(
              f"0 0 {width} {height}\n"
          )

          print("Rectangle:")
          print(rect.read_text())
          PY

          ls -lah teacher_input

      # ============================================================
      # MODULE TEST
      # ============================================================

      - name: Verify PIFuHDC modules
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, ".")

          import lib
          import lib.mesh_util
          import lib.options
          import apps
          import apps.recon

          print("PIFuHDC imports OK.")
          PY

      # ============================================================
      # COLOR CHECKPOINT FIX
      # ============================================================

      - name: Configure color checkpoint
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/recon.py")
          text = path.read_text()

          old = "checkpoints/net_C_choice2.pt"
          new = "checkpoints/net_C_HD.pt"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
              print("Color checkpoint path updated.")
          else:
              print("Color checkpoint path already correct or not present.")
          PY

      # ============================================================
      # MARCHING CUBES FIX
      # ============================================================

      - name: Fix Marching Cubes API
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/mesh_util.py")

          if not path.exists():
              raise SystemExit("lib/mesh_util.py not found.")

          text = path.read_text()

          old = "measure.marching_cubes_lewiner"
          new = "measure.marching_cubes"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text)
              print("Marching Cubes API fixed.")
          else:
              print("Marching Cubes API already fixed.")
          PY

      - name: Verify Marching Cubes
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import skimage
          from skimage import measure

          print("scikit-image:", skimage.__version__)

          if not hasattr(measure, "marching_cubes"):
              raise SystemExit(
                  "marching_cubes API is unavailable."
              )

          print("marching_cubes API: OK")
          PY

      # ============================================================
      # DATASET CHECK
      # ============================================================

      - name: Verify teacher dataset
        working-directory: pifuhdc
        run: |
          test -f ../teacher_input/sample.jpg
          test -f ../teacher_input/sample_rect.txt

          echo "Teacher input verified."

      # ============================================================
      # REAL PIFuHDC INFERENCE
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC"
          echo "=========================================="

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect \
            2>&1 | tee ../teacher_output/pifuhdc.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "PIFuHDC exit code: $EXIT_CODE"

          echo ""
          echo "Generated files:"

          find ../teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          OBJ_COUNT=$(find ../teacher_output \
            -type f \
            -iname "*.obj" \
            2>/dev/null | wc -l)

          echo ""
          echo "OBJ COUNT: $OBJ_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No OBJ generated."
            echo ""
            cat ../teacher_output/pifuhdc.log
            exit 1
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

          echo ""
          echo "PIFuHDC generated OBJ successfully."

      # ============================================================
      # OBJ VALIDATION
      # ============================================================

      - name: Validate OBJ
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print("OBJ count:", len(objs))

          if not objs:
              print("No OBJ available.")
              raise SystemExit(0)

          for obj in objs:

              vertices = 0
              faces = 0
              colored_vertices = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):
                          vertices += 1

                          if len(line.split()) >= 7:
                              colored_vertices += 1

                      elif line.startswith("f "):
                          faces += 1

              print("")
              print("File:", obj)
              print("Size:", obj.stat().st_size)
              print("Vertices:", vertices)
              print("Faces:", faces)
              print("Colored vertices:", colored_vertices)

              if vertices == 0:
                  raise SystemExit(
                      "OBJ contains zero vertices."
                  )

              if faces == 0:
                  raise SystemExit(
                      "OBJ contains zero faces."
                  )

          print("")
          print("OBJ VALIDATION PASSED.")

      # ============================================================
      # OBJ -> GLB
      # ============================================================

      - name: Convert OBJ to GLB
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          print("==========================================")
          print("OBJ -> GLB")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:
              print("No OBJ found.")
              raise SystemExit(0)

          for obj in objs:

              print("")
              print("Loading:", obj)

              mesh = trimesh.load(
                  obj,
                  force="mesh",
                  process=False
              )

              print(
                  "Vertices:",
                  len(mesh.vertices)
              )

              print(
                  "Faces:",
                  len(mesh.faces)
              )

              if len(mesh.vertices) == 0:
                  raise SystemExit(
                      "OBJ has no vertices."
                  )

              if len(mesh.faces) == 0:
                  raise SystemExit(
                      "OBJ has no faces."
                  )

              glb = obj.with_suffix(".glb")

              print(
                  "Exporting:",
                  glb
              )

              mesh.export(
                  glb,
                  file_type="glb"
              )

              if not glb.exists():
                  raise SystemExit(
                      "GLB was not created."
                  )

              if glb.stat().st_size == 0:
                  raise SystemExit(
                      "GLB is empty."
                  )

              print(
                  "GLB created:",
                  glb
              )

              print(
                  "GLB size:",
                  glb.stat().st_size,
                  "bytes"
              )

          print("")
          print("GLB conversion complete.")

      # ============================================================
      # GLB VALIDATION
      # ============================================================

      - name: Validate GLB
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh

          glbs = list(
              Path("teacher_output").rglob("*.glb")
          )

          print("GLB count:", len(glbs))

          if not glbs:
              print("No GLB generated.")
              raise SystemExit(0)

          for glb in glbs:

              print("")
              print("File:", glb)
              print(
                  "Size:",
                  glb.stat().st_size,
                  "bytes"
              )

              scene = trimesh.load(
                  glb,
                  force="scene"
              )

              print(
                  "Geometry:",
                  len(scene.geometry)
              )

              if len(scene.geometry) == 0:
                  raise SystemExit(
                      "GLB contains no geometry."
                  )

          print("")
          print("GLB VALIDATION PASSED.")

      # ============================================================
      # FINAL FILE LIST
      # ============================================================

      - name: Show final results
        if: always()
        run: |
          echo "=========================================="
          echo "FINAL RESULTS"
          echo "=========================================="

          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null \
            | sort

          echo ""
          echo "OBJ files:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "GLB files:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PNG files:"
          find teacher_output \
            -type f \
            -iname "*.png" \
            -print \
            2>/dev/null || true

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload teacher results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-results
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/apps/recon.py
            pifuhdc/apps/test_colorHD.py
            pifuhdc/lib/mesh_util.py
          if-no-files-found: warn
          retention-days: 7
