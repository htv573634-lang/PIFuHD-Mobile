name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-pifuhdc-teacher:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1


      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            pyembree==0.1.12 \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2


      # ============================================================
      # VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Python environment
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL

          print("==========================================")
          print("PYTHON ENVIRONMENT")
          print("==========================================")

          print("Python:", __import__("sys").version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)

          print("")
          print("CUDA available:", torch.cuda.is_available())

          if torch.cuda.is_available():
              print("CUDA version:", torch.version.cuda)
              print("GPU:", torch.cuda.get_device_name(0))

          print("")
          print("Environment OK.")
          PY


      # ============================================================
      # CLONE OFFICIAL PIFUHDC
      # ============================================================

      - name: Clone official PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo "PIFuHDC cloned."

          cd pifuhdc

          echo ""
          echo "Repository:"
          find . -maxdepth 2 -type f | sort | head -200


      # ============================================================
      # CREATE CHECKPOINT DIRECTORY
      # ============================================================

      - name: Prepare checkpoints
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "Checkpoint directory:"
          ls -lah checkpoints


      # ============================================================
      # DOWNLOAD GEOMETRY CHECKPOINT
      # ============================================================

      - name: Download PIFuHD geometry checkpoint
        working-directory: pifuhdc
        run: |
          echo "Downloading PIFuHD geometry checkpoint..."

          wget -q \
            --show-progress \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt \
            -O checkpoints/pifuhd.pt

          echo ""
          echo "Geometry checkpoint:"
          ls -lh checkpoints/pifuhd.pt

          test -s checkpoints/pifuhd.pt


      # ============================================================
      # DOWNLOAD COLOR CHECKPOINT
      # ============================================================

      - name: Download PIFuHDC color checkpoint
        working-directory: pifuhdc
        run: |
          echo "Downloading color checkpoint..."

          pip install -q gdown

          gdown \
            1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM \
            -O checkpoints/net_C_HD.pt

          echo ""
          echo "Color checkpoint:"
          ls -lh checkpoints/net_C_HD.pt

          test -s checkpoints/net_C_HD.pt


      # ============================================================
      # SHOW CHECKPOINTS
      # ============================================================

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINTS"
          echo "=========================================="

          ls -lah checkpoints

          echo ""
          echo "Geometry size:"
          du -h checkpoints/pifuhd.pt

          echo ""
          echo "Color size:"
          du -h checkpoints/net_C_HD.pt


      # ============================================================
      # DOWNLOAD OFFICIAL SAMPLE
      # ============================================================

      - name: Prepare official PIFuHDC sample
        run: |
          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "Downloading official PIFuHDC sample..."

          wget -q \
            --show-progress \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg \
            -O teacher_input/sample.jpg

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          image_path = Path("teacher_input/sample.jpg")

          image = Image.open(image_path)

          width, height = image.size

          print("==========================================")
          print("TEACHER INPUT")
          print("==========================================")

          print("Image:", image_path)
          print("Width:", width)
          print("Height:", height)
          print("Mode:", image.mode)

          image.verify()

          rect_path = Path("teacher_input/sample_rect.txt")

          rect_path.write_text(
              f"0 0 {width} {height}\n"
          )

          print("")
          print("Created:", rect_path)
          print(rect_path.read_text())

          print("")
          print("Input validation OK.")
          PY

          ls -lah teacher_input


      # ============================================================
      # VERIFY PIFUHDC IMPORTS
      # ============================================================

      - name: Verify PIFuHDC imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, ".")

          print("==========================================")
          print("PIFuHDC IMPORT TEST")
          print("==========================================")

          import lib
          import lib.mesh_util
          import lib.options
          import apps.recon

          print("PIFuHDC imports: OK")
          PY


      # ============================================================
      # PATCH mesh_util.py
      #
      # IMPORTANT:
      # The original PIFuHDC source uses:
      #
      #     except:
      #         print('error cannot marching cubes')
      #         return -1
      #
      # We replace it with a diagnostic handler.
      # ============================================================

      - name: Patch mesh_util.py for Marching Cubes diagnostics
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/mesh_util.py")

          text = path.read_text()

          print("==========================================")
          print("PATCHING mesh_util.py")
          print("==========================================")

          target = "    except:\n        print('error cannot marching cubes')\n        return -1"

          replacement = (
              "    except Exception as e:\n"
              "        print('')\n"
              "        print('==========================================')\n"
              "        print('MARCHING CUBES INTERNAL EXCEPTION')\n"
              "        print('==========================================')\n"
              "        print('Exception type:', type(e).__name__)\n"
              "        print('Exception message:', str(e))\n"
              "        print('')\n"
              "        print('scikit-image version:')\n"
              "        try:\n"
              "            import skimage\n"
              "            print(skimage.__version__)\n"
              "        except Exception:\n"
              "            print('Unable to determine scikit-image version')\n"
              "        print('')\n"
              "        print('SDF diagnostics:')\n"
              "        try:\n"
              "            print('SDF shape:', sdf.shape)\n"
              "            print('SDF dtype:', sdf.dtype)\n"
              "            print('SDF min:', float(np.nanmin(sdf)))\n"
              "            print('SDF max:', float(np.nanmax(sdf)))\n"
              "            print('SDF mean:', float(np.nanmean(sdf)))\n"
              "            print('SDF NaN count:', int(np.isnan(sdf).sum()))\n"
              "            print('SDF Inf count:', int(np.isinf(sdf).sum()))\n"
              "            print('SDF finite count:', int(np.isfinite(sdf).sum()))\n"
              "            print('SDF total count:', int(sdf.size))\n"
              "        except Exception as diag_error:\n"
              "            print('Could not inspect SDF:', type(diag_error).__name__, str(diag_error))\n"
              "        print('')\n"
              "        print('Marching Cubes threshold:', thresh)\n"
              "        print('')\n"
              "        print('FULL TRACEBACK')\n"
              "        print('------------------------------------------')\n"
              "        import traceback\n"
              "        traceback.print_exc()\n"
              "        print('==========================================')\n"
              "        raise"
          )

          if target not in text:
              print("")
              print("ERROR: Marching Cubes handler was not found.")
              print("")
              print("Searching mesh_util.py for exception handlers:")
              print("------------------------------------------")

              for number, line in enumerate(
                  text.splitlines(),
                  1
              ):
                  if "except" in line:
                      print(f"{number}: {line}")

              raise SystemExit(1)

          text = text.replace(
              target,
              replacement,
              1
          )

          path.write_text(text)

          print("")
          print("Marching Cubes diagnostic patch applied successfully.")
          PY


      # ============================================================
      # VERIFY PATCH
      # ============================================================

      - name: Verify mesh_util.py patch
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "VERIFYING mesh_util.py"
          echo "=========================================="

          grep -n \
            -A45 \
            -B5 \
            "MARCHING CUBES INTERNAL EXCEPTION" \
            lib/mesh_util.py

          echo ""
          echo "Patch verification complete."


      # ============================================================
      # PATCH recon.py
      #
      # This gives us additional information if reconstruction
      # returns -1 or fails later in the pipeline.
      # ============================================================

      - name: Patch recon.py diagnostics
        working-directory: pifuhdc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/recon.py")
          text = path.read_text()

          print("==========================================")
          print("PATCHING recon.py")
          print("==========================================")

          old = "        verts, faces, _, _ = reconstruction("

          if old in text:
              replacement = (
                  "        print('Starting reconstruction()...')\n"
                  "        verts, faces, _, _ = reconstruction("
              )

              text = text.replace(
                  old,
                  replacement,
                  1
              )

              path.write_text(text)

              print("recon.py diagnostic patch applied.")
          else:
              print("recon.py reconstruction marker not found.")
              print("Continuing without secondary patch.")


      # ============================================================
      # VERIFY DATASET
      # ============================================================

      - name: Verify PIFuHDC dataset
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DATASET TEST"
          echo "=========================================="

          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")

          print("Input directory:")
          input_dir = Path("../teacher_input")

          for item in sorted(input_dir.iterdir()):
              print(
                  item,
                  item.stat().st_size,
                  "bytes"
              )

          print("")
          print("Dataset files:")
          print("sample.jpg:", (input_dir / "sample.jpg").exists())
          print("sample_rect.txt:", (input_dir / "sample_rect.txt").exists())

          if not (input_dir / "sample.jpg").exists():
              raise SystemExit("sample.jpg missing")

          if not (input_dir / "sample_rect.txt").exists():
              raise SystemExit("sample_rect.txt missing")

          print("")
          print("Dataset preparation OK.")
          PY


      # ============================================================
      # RUN REAL PIFUHDC TEACHER
      #
      # Resolution 256 keeps GitHub Actions memory/time reasonable.
      # This is REAL PIFuHDC inference, not synthetic data.
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        shell: bash
        run: |
          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input files:"
          ls -lah ../teacher_input

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints

          echo ""
          echo "Starting PIFuHDC inference..."
          echo ""

          python apps/test_colorHD.py \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

          EXIT_CODE=$?

          echo ""
          echo "PIFuHDC EXIT CODE: ${EXIT_CODE}"

          exit ${EXIT_CODE}


      # ============================================================
      # INSPECT OUTPUT
      # ============================================================

      - name: Inspect teacher output
        if: always()
        run: |
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ -d teacher_output ]; then
            find teacher_output \
              -type f \
              -printf "%p %s bytes\n" \
              | sort
          else
            echo "teacher_output directory does not exist."
          fi

          echo ""
          echo "Output tree:"
          find teacher_output \
            -maxdepth 5 \
            -print \
            2>/dev/null || true


      # ============================================================
      # FIND GENERATED MESHES
      # ============================================================

      - name: Find generated meshes
        if: always()
        run: |
          echo "=========================================="
          echo "SEARCHING FOR MESHES"
          echo "=========================================="

          echo ""
          echo "OBJ files:"
          find teacher_output \
            -type f \
            -iname "*.obj" \
            -print \
            2>/dev/null || true

          echo ""
          echo "PLY files:"
          find teacher_output \
            -type f \
            -iname "*.ply" \
            -print \
            2>/dev/null || true

          echo ""
          echo "GLB files:"
          find teacher_output \
            -type f \
            -iname "*.glb" \
            -print \
            2>/dev/null || true


      # ============================================================
      # VALIDATE OBJ
      # ============================================================

      - name: Validate generated OBJ
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          print("==========================================")
          print("OBJ VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print("OBJ files found:", len(objs))

          if not objs:
              print("")
              print("NO OBJ GENERATED.")
              print("Teacher validation did not produce a mesh.")
              raise SystemExit(0)

          for obj in objs:
              print("")
              print("OBJ:", obj)
              print("Size:", obj.stat().st_size, "bytes")

              vertices = 0
              faces = 0
              colors = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:
                  for line in f:
                      if line.startswith("v "):
                          vertices += 1

                          parts = line.split()

                          if len(parts) >= 7:
                              colors += 1

                      elif line.startswith("f "):
                          faces += 1

              print("Vertices:", vertices)
              print("Faces:", faces)
              print("Colored vertices:", colors)

              if vertices == 0:
                  raise SystemExit(
                      f"OBJ has no vertices: {obj}"
                  )

              if faces == 0:
                  raise SystemExit(
                      f"OBJ has no faces: {obj}"
                  )

          print("")
          print("OBJ validation passed.")
          PY


      # ============================================================
      # INSTALL MESH VALIDATION TOOL
      # ============================================================

      - name: Install mesh validation tools
        if: always()
        run: |
          pip install -q trimesh==3.23.5


      # ============================================================
      # VALIDATE MESH WITH TRIMESH
      # ============================================================

      - name: Validate mesh geometry
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          try:
              import trimesh
          except Exception as e:
              print("trimesh import failed:", e)
              raise SystemExit(0)

          print("==========================================")
          print("TRIMESH VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:
              print("No OBJ files found.")
              raise SystemExit(0)

          for obj in objs:
              print("")
              print("Loading:", obj)

              try:
                  mesh = trimesh.load(
                      obj,
                      force="mesh",
                      process=False
                  )

                  print("Vertices:", len(mesh.vertices))
                  print("Faces:", len(mesh.faces))

                  if len(mesh.vertices) == 0:
                      raise RuntimeError(
                          "Mesh contains zero vertices"
                      )

                  if len(mesh.faces) == 0:
                      raise RuntimeError(
                          "Mesh contains zero faces"
                      )

                  print("Bounds:")
                  print(mesh.bounds)

                  print("")
                  print("Mesh validation OK.")

              except Exception as e:
                  print("")
                  print("TRIMESH ERROR")
                  print(type(e).__name__)
                  print(str(e))

                  raise


      # ============================================================
      # UPLOAD ALL TEACHER RESULTS
      # ============================================================

      - name: Upload PIFuHDC teacher results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-results
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/lib/mesh_util.py
            pifuhdc/apps/recon.py
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: Final teacher validation status
        if: always()
        run: |
          echo "=========================================="
          echo "PIFuHDC TEACHER VALIDATION FINISHED"
          echo "=========================================="

          echo ""
          echo "Input:"
          find teacher_input \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "Output:"
          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null || true

          echo ""
          echo "Next step:"
          echo "Do not start student distillation until a valid OBJ mesh"
          echo "with vertices and faces has been generated."
