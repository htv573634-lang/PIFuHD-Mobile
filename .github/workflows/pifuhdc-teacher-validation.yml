name: Step 4A - Real PIFuHDC Teacher Validation

on:
  workflow_dispatch:

jobs:
  teacher-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            tqdm \
            gdown \
            trimesh \
            pyembree

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Verify Python environment
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import PIL
          import cv2
          import matplotlib
          import trimesh

          print()
          print("==========================================")
          print("PYTHON ENVIRONMENT")
          print("==========================================")
          print("Torch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("OpenCV:", cv2.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Trimesh:", trimesh.__version__)
          print()
          print("Environment check passed.")
          PY

      - name: Clone official PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      - name: Prepare checkpoint directory
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt
          rm -f pifuhdc/checkpoints/net_C_choice2.pt

      - name: Download PIFuHD geometry teacher
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

      - name: Download PIFuHDC color teacher
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt

      - name: Create official default color checkpoint alias
        run: |
          cp \
            pifuhdc/checkpoints/net_C_HD.pt \
            pifuhdc/checkpoints/net_C_choice2.pt

          echo
          echo "=========================================="
          echo "COLOR CHECKPOINT ALIAS"
          echo "=========================================="

          ls -lh \
            pifuhdc/checkpoints/net_C_HD.pt \
            pifuhdc/checkpoints/net_C_choice2.pt

          echo
          echo "Both filenames point to the same downloaded"
          echo "PIFuHDC color checkpoint."

      - name: Verify teacher checkpoints
        run: |
          python - <<'PY'
          import os
          import hashlib

          paths = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt",
              "pifuhdc/checkpoints/net_C_choice2.pt"
          ]

          print()
          print("==========================================")
          print("TEACHER CHECKPOINT VERIFICATION")
          print("==========================================")

          for path in paths:
              if not os.path.exists(path):
                  raise RuntimeError("Missing checkpoint: " + path)

              size = os.path.getsize(path)

              sha256 = hashlib.sha256()

              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      sha256.update(block)

              print()
              print("File:", path)
              print("Bytes:", size)
              print("MB:", round(size / 1024 / 1024, 2))
              print("SHA256:", sha256.hexdigest())

          hd = hashlib.sha256(
              open(
                  "pifuhdc/checkpoints/net_C_HD.pt",
                  "rb"
              ).read()
          ).hexdigest()

          choice2 = hashlib.sha256(
              open(
                  "pifuhdc/checkpoints/net_C_choice2.pt",
                  "rb"
              ).read()
          ).hexdigest()

          print()
          print("Color checkpoint hashes identical:", hd == choice2)

          if hd != choice2:
              raise RuntimeError(
                  "net_C_HD.pt and net_C_choice2.pt differ."
              )

          print()
          print("Teacher checkpoints verified.")
          PY

      - name: Prepare input and output directories
        run: |
          mkdir -p teacher_input
          mkdir -p teacher_output
          mkdir -p reports

      - name: Download official sample
        run: |
          wget \
            -O teacher_input/sample.jpg \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg

          echo
          echo "=========================================="
          echo "INPUT IMAGE"
          echo "=========================================="

          ls -lh teacher_input/

      - name: Inspect input image
        run: |
          python - <<'PY'
          from PIL import Image

          path = "teacher_input/sample.jpg"

          image = Image.open(path)

          print()
          print("==========================================")
          print("IMAGE INFORMATION")
          print("==========================================")
          print("Format:", image.format)
          print("Size:", image.size)
          print("Mode:", image.mode)
          print()
          print("Input image loaded successfully.")
          PY

      - name: Create rectangle crop metadata
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np

          image_path = "teacher_input/sample.jpg"
          rect_path = "teacher_input/sample_rect.txt"

          image = Image.open(image_path)

          width, height = image.size

          # Full-image square crop.
          side = max(width, height)

          x = (width - side) // 2
          y = (height - side) // 2

          rect = np.array(
              [[x, y, side, side]],
              dtype=np.int32
          )

          np.savetxt(
              rect_path,
              rect,
              fmt="%d"
          )

          print()
          print("==========================================")
          print("RECTANGLE METADATA")
          print("==========================================")
          print("Image:", width, "x", height)
          print("Rect:", rect.tolist())
          print("Saved:", rect_path)
          PY

          cat teacher_input/sample_rect.txt

      - name: Verify PIFuHDC imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import apps.test_colorHD
          import apps.recon

          print()
          print("==========================================")
          print("PIFuHDC IMPORT TEST")
          print("==========================================")
          print("test_colorHD import: OK")
          print("recon import: OK")
          print()
          print("PIFuHDC Python modules loaded.")
          PY

      - name: Verify checkpoint argument handling
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys

          sys.argv = [
              "apps.test_colorHD",
              "--input_path",
              "../teacher_input",
              "--out_path",
              "../teacher_output",
              "--ckpt_path",
              "./checkpoints/pifuhd.pt",
              "--ckpt_path_Color",
              "./checkpoints/net_C_HD.pt",
              "--resolution",
              "256",
              "--use_rect"
          ]

          import apps.test_colorHD

          print()
          print("==========================================")
          print("CHECKPOINT ARGUMENT TEST")
          print("==========================================")
          print("Geometry checkpoint:")
          print("./checkpoints/pifuhd.pt")
          print()
          print("Color checkpoint:")
          print("./checkpoints/net_C_HD.pt")
          print()
          print("Rectangle mode:")
          print("enabled")
          PY

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          echo
          echo "=========================================="
          echo "REAL PIFuHDC TEACHER INFERENCE"
          echo "=========================================="

          echo
          echo "Geometry:"
          echo "checkpoints/pifuhd.pt"

          echo
          echo "Color:"
          echo "checkpoints/net_C_HD.pt"

          echo
          echo "Resolution:"
          echo "256"

          echo
          echo "Crop mode:"
          echo "rectangle"

          echo
          echo "Starting inference..."
          echo

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

      - name: Inspect teacher output
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ -d "teacher_output" ]; then
            find teacher_output \
              -maxdepth 8 \
              -type f \
              -printf "%p %s bytes\n" \
              | sort
          else
            echo "teacher_output directory does not exist."
          fi

      - name: Validate generated mesh
        if: success()
        run: |
          python - <<'PY'
          import glob
          import os

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("MESH VALIDATION")
          print("==========================================")

          if not paths:
              raise RuntimeError(
                  "PIFuHDC completed but no OBJ mesh was found."
              )

          for path in paths:
              size = os.path.getsize(path)

              print()
              print("OBJ:", path)
              print("Bytes:", size)

              if size == 0:
                  raise RuntimeError(
                      "Generated OBJ is empty: " + path
                  )

          print()
          print("REAL 3D MESH GENERATED SUCCESSFULLY.")

      - name: Analyze generated mesh
        if: success()
        run: |
          python - <<'PY'
          import glob

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("PIFuHDC MESH ANALYSIS")
          print("==========================================")

          for path in paths:
              vertices = 0
              faces = 0
              vertex_colors = 0

              with open(
                  path,
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:
                      if line.startswith("v "):
                          vertices += 1

                      elif line.startswith("f "):
                          faces += 1

                      elif line.startswith("vc "):
                          vertex_colors += 1

              print()
              print("File:", path)
              print("Vertices:", vertices)
              print("Faces:", faces)
              print("Vertex colors:", vertex_colors)

          print()
          print("Mesh analysis completed.")

      - name: Create validation report
        if: always()
        run: |
          {
            echo "REAL PIFuHDC TEACHER VALIDATION"
            echo "================================"
            echo
            echo "Teacher:"
            echo "PIFuHD geometry + PIFuHDC color"
            echo
            echo "Resolution:"
            echo "256"
            echo
            echo "Color checkpoint:"
            echo "net_C_HD.pt"
            echo
            echo "Compatibility alias:"
            echo "net_C_choice2.pt"
            echo
            echo "Crop:"
            echo "rectangle"
            echo
            echo "Checkpoint files:"
            ls -lh pifuhdc/checkpoints/
            echo
            echo "Teacher output:"
            find teacher_output \
              -maxdepth 8 \
              -type f \
              -printf "%p %s bytes\n" \
              2>/dev/null || true
            echo
            echo "Purpose:"
            echo "Validate real PIFuHDC teacher output"
            echo "before production student distillation."
          } > reports/teacher_validation.txt

          cat reports/teacher_validation.txt

      - name: Upload teacher validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-real-teacher-validation
          path: |
            teacher_output/
            reports/teacher_validation.txt
          if-no-files-found: warn
          retention-days: 7
