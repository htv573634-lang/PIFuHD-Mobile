name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-pifuhdc:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout PIFuHD-Mobile
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            freeglut3-dev

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            numpy==1.23.5 \
            scipy==1.10.1 \
            pillow==9.5.0 \
            scikit-image==0.19.3 \
            opencv-python-headless==4.8.1.78 \
            tqdm==4.66.1 \
            matplotlib==3.7.5 \
            trimesh==3.23.5 \
            pyembree==0.1.12

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2

          pip install gdown

      # ============================================================
      # ENVIRONMENT CHECK
      # ============================================================

      - name: Show Python package versions
        run: |
          echo "=========================================="
          echo "PYTHON ENVIRONMENT"
          echo "=========================================="

          python --version

          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import skimage
          import cv2
          import PIL
          import trimesh

          print("PyTorch       :", torch.__version__)
          print("Torchvision   :", torchvision.__version__)
          print("NumPy         :", numpy.__version__)
          print("SciPy         :", scipy.__version__)
          print("scikit-image  :", skimage.__version__)
          print("OpenCV        :", cv2.__version__)
          print("Pillow        :", PIL.__version__)
          print("Trimesh       :", trimesh.__version__)
          print("CUDA available:", torch.cuda.is_available())
          PY

      # ============================================================
      # CLONE OFFICIAL PIFuHDC
      # ============================================================

      - name: Clone official PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo "=========================================="
          echo "PIFuHDC COMMIT"
          echo "=========================================="

          cd pifuhdc

          git rev-parse HEAD

      # ============================================================
      # GEOMETRY CHECKPOINT
      # ============================================================

      - name: Download PIFuHD geometry checkpoint
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "=========================================="
          echo "DOWNLOADING GEOMETRY CHECKPOINT"
          echo "=========================================="

          wget -q --show-progress \
            "https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt" \
            -O checkpoints/pifuhd.pt

          echo ""
          echo "Geometry checkpoint:"
          ls -lh checkpoints/pifuhd.pt

      # ============================================================
      # COLOR CHECKPOINT
      # ============================================================

      - name: Download PIFuHDC color checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING COLOR CHECKPOINT"
          echo "=========================================="

          gdown \
            "1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O checkpoints/net_C_HD.pt

          echo ""
          echo "Color checkpoint:"
          ls -lh checkpoints/net_C_HD.pt

      # ============================================================
      # CHECKPOINT VALIDATION
      # ============================================================

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINT VALIDATION"
          echo "=========================================="

          test -f checkpoints/pifuhd.pt
          test -f checkpoints/net_C_HD.pt

          GEOMETRY_SIZE=$(stat -c%s checkpoints/pifuhd.pt)
          COLOR_SIZE=$(stat -c%s checkpoints/net_C_HD.pt)

          echo ""
          echo "Geometry checkpoint:"
          ls -lh checkpoints/pifuhd.pt
          echo "Bytes: $GEOMETRY_SIZE"

          echo ""
          echo "Color checkpoint:"
          ls -lh checkpoints/net_C_HD.pt
          echo "Bytes: $COLOR_SIZE"

          echo ""
          echo "SHA256:"
          sha256sum checkpoints/pifuhd.pt
          sha256sum checkpoints/net_C_HD.pt

      # ============================================================
      # OFFICIAL TEST IMAGE
      # ============================================================

      - name: Prepare official PIFuHDC test image
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "=========================================="
          echo "DOWNLOADING OFFICIAL PIFuHDC TEST IMAGE"
          echo "=========================================="

          wget -q --show-progress \
            "https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg" \
            -O teacher_input/sample.jpg

          echo ""
          echo "Input image:"
          ls -lh teacher_input/sample.jpg

          file teacher_input/sample.jpg

      # ============================================================
      # IMAGE VALIDATION
      # ============================================================

      - name: Validate input image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path("teacher_input/sample.jpg")

          print("==========================================")
          print("INPUT IMAGE VALIDATION")
          print("==========================================")

          if not path.exists():
              raise SystemExit("ERROR: sample.jpg does not exist")

          print("File size:", path.stat().st_size, "bytes")

          img = Image.open(path)

          print("Format:", img.format)
          print("Mode:", img.mode)
          print("Size:", img.size)

          if img.width <= 0 or img.height <= 0:
              raise SystemExit("ERROR: invalid image dimensions")

          img.verify()

          print("")
          print("Image validation: OK")
          PY

      # ============================================================
      # RECTANGLE METADATA
      # ============================================================

      - name: Create rectangle metadata
        run: |
          python - <<'PY'
          from PIL import Image

          image_path = "teacher_input/sample.jpg"
          rect_path = "teacher_input/sample_rect.txt"

          img = Image.open(image_path)

          width, height = img.size

          with open(rect_path, "w") as f:
              f.write(f"0 0 {width} {height}\n")

          print("==========================================")
          print("RECTANGLE METADATA")
          print("==========================================")

          print("Image width :", width)
          print("Image height:", height)
          print("Rectangle   :", f"0 0 {width} {height}")

          print("")
          print("Contents:")
          print(open(rect_path).read())
          PY

      # ============================================================
      # DATASET VALIDATION
      # ============================================================

      - name: Validate PIFuHDC dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys
          import os

          sys.path.insert(0, os.getcwd())

          from lib.data import EvalDataset

          class Opt:
              dataroot = "../teacher_input"
              loadSize = 1024

          print("==========================================")
          print("DATASET VALIDATION")
          print("==========================================")

          dataset = EvalDataset(Opt())

          print("Dataset length:", len(dataset))
          print("Image files:", dataset.img_files)

          if len(dataset) != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 image, found {len(dataset)}"
              )

          item = dataset[0]

          print("")
          print("Sample name:", item["name"])
          print("img shape:", item["img"].shape)
          print("img_512 shape:", item["img_512"].shape)
          print("calib shape:", item["calib"].shape)
          print("b_min:", item["b_min"])
          print("b_max:", item["b_max"])

          print("")
          print("Dataset validation: OK")
          PY

      # ============================================================
      # IMPORT VALIDATION
      # ============================================================

      - name: Validate PIFuHDC imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys
          import os

          sys.path.insert(0, os.getcwd())

          print("==========================================")
          print("PIFuHDC IMPORT VALIDATION")
          print("==========================================")

          import torch
          import torchvision
          import cv2
          import numpy
          import scipy
          import PIL
          import skimage

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("SciPy:", scipy.__version__)
          print("scikit-image:", skimage.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)

          from lib.model import HGPIFuNetwNML
          from lib.model import HGPIFuMRNet
          from lib.model import HGResBlkPIFuNet

          from lib.mesh_util import reconstruction
          from lib.mesh_util import save_obj_mesh_with_color

          print("")
          print("PIFuHDC imports: OK")
          PY

      # ============================================================
      # PATCH mesh_util.py
      #
      # IMPORTANT:
      # Official PIFuHDC uses a bare "except:" here.
      # It prints:
      #
      #   error cannot marching cubes
      #
      # and returns -1.
      #
      # We replace that exact handler so the real exception,
      # SDF statistics, and traceback are visible.
      # ============================================================

      - name: Patch mesh_util.py for Marching Cubes diagnostics
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/mesh_util.py")

          text = path.read_text()

          print("==========================================")
          print("PATCHING mesh_util.py")
          print("==========================================")

          old = """    except:
        print('error cannot marching cubes')
        return -1"""

          new = """    except Exception as e:
        print("")
        print("==========================================")
        print("MARCHING CUBES INTERNAL EXCEPTION")
        print("==========================================")
        print("Exception type:", type(e).__name__)
        print("Exception message:", str(e))
        print("")
        print("scikit-image version:")

        try:
            import skimage
            print(skimage.__version__)
        except Exception:
            print("Unable to determine scikit-image version")

        print("")
        print("SDF diagnostics:")

        try:
            print("SDF shape:", sdf.shape)
            print("SDF dtype:", sdf.dtype)
            print("SDF min:", float(np.nanmin(sdf)))
            print("SDF max:", float(np.nanmax(sdf)))
            print("SDF mean:", float(np.nanmean(sdf)))
            print("SDF NaN count:", int(np.isnan(sdf).sum()))
            print("SDF Inf count:", int(np.isinf(sdf).sum()))
            print("SDF finite count:", int(np.isfinite(sdf).sum()))
            print("SDF total count:", int(sdf.size))
        except Exception as diag_error:
            print(
                "Could not inspect SDF:",
                type(diag_error).__name__,
                str(diag_error)
            )

        print("")
        print("Marching Cubes threshold:", thresh)

        print("")
        print("FULL TRACEBACK")
        print("------------------------------------------")

        import traceback
        traceback.print_exc()

        print("==========================================")

        raise"""

          if old not in text:
              print("")
              print("ERROR: Exact Marching Cubes handler was not found.")
              print("")
              print("Searching mesh_util.py for exception handlers:")
              print("------------------------------------------")

              for number, line in enumerate(
                  text.splitlines(),
                  1
              ):
                  if "except" in line:
                      print(
                          f"{number}: {line}"
                      )

              raise SystemExit(1)

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text
          )

          print("")
          print("Marching Cubes diagnostic patch applied successfully.")
          PY

      # ============================================================
      # PATCH recon.py
      #
      # This is a secondary diagnostic in case another exception
      # occurs around reconstruction/color processing.
      # ============================================================

      - name: Patch recon.py for full traceback
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/recon.py")

          text = path.read_text()

          lines = text.splitlines()

          patched = False

          for i, line in enumerate(lines):

              if line.strip() != "except Exception as e:":
                  continue

              if i + 1 >= len(lines):
                  continue

              if "print(e)" not in lines[i + 1]:
                  continue

              indent = line[
                  :len(line) - len(line.lstrip())
              ]

              replacement = [
                  indent + "except Exception as e:",
                  indent + "    print('')",
                  indent + "    print('==========================================')",
                  indent + "    print('PIFuHDC INTERNAL EXCEPTION')",
                  indent + "    print('==========================================')",
                  indent + "    print('Exception type:', type(e).__name__)",
                  indent + "    print('Exception message:', str(e))",
                  indent + "    import traceback",
                  indent + "    traceback.print_exc()",
                  indent + "    print('==========================================')",
                  indent + "    raise",
              ]

              lines[i:i + 2] = replacement

              patched = True

              break

          if not patched:

              print(
                  "WARNING: recon.py exception handler "
                  "was not found."
              )

          else:

              path.write_text(
                  "\n".join(lines) + "\n"
              )

              print(
                  "recon.py traceback patch applied."
              )
          PY

      # ============================================================
      # CONFIRM PATCHES
      # ============================================================

      - name: Confirm diagnostic patches
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DIAGNOSTIC PATCH CHECK"
          echo "=========================================="

          echo ""
          echo "mesh_util.py:"
          echo "------------------------------------------"

          grep -n \
            -A35 \
            -B5 \
            "MARCHING CUBES INTERNAL EXCEPTION" \
            lib/mesh_util.py || true

          echo ""
          echo "recon.py:"
          echo "------------------------------------------"

          grep -n \
            -A15 \
            -B5 \
            "PIFuHDC INTERNAL EXCEPTION" \
            apps/recon.py || true

      # ============================================================
      # RUN REAL PIFuHDC TEACHER
      # ============================================================

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          set +e

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input files:"
          find ../teacher_input \
            -maxdepth 1 \
            -type f \
            -print

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints/

          echo ""
          echo "Python environment:"

          python - <<'PY'
          import torch
          import skimage

          print("PyTorch:", torch.__version__)
          print("scikit-image:", skimage.__version__)
          print("CUDA:", torch.cuda.is_available())
          PY

          echo ""
          echo "Starting PIFuHDC inference..."
          echo ""

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "PIFuHDC EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit 0

      # ============================================================
      # COMPLETE OUTPUT DIAGNOSTICS
      # ============================================================

      - name: Inspect complete PIFuHDC output
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "PIFuHDC TEACHER DIAGNOSTIC REPORT"
          echo "=========================================="

          echo ""
          echo "WORKSPACE OBJ FILES"
          echo "------------------------------------------"

          find . \
            -type f \
            -iname "*.obj" \
            -print

          echo ""
          echo "WORKSPACE PLY FILES"
          echo "------------------------------------------"

          find . \
            -type f \
            -iname "*.ply" \
            -print

          echo ""
          echo "WORKSPACE PNG FILES"
          echo "------------------------------------------"

          find . \
            -type f \
            -iname "*.png" \
            -print

          echo ""
          echo "WORKSPACE GLB FILES"
          echo "------------------------------------------"

          find . \
            -type f \
            -iname "*.glb" \
            -print

          echo ""
          echo "teacher_output CONTENTS"
          echo "------------------------------------------"

          find teacher_output \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null

          echo ""
          echo "PIFuHDC RESULTS CONTENTS"
          echo "------------------------------------------"

          find pifuhdc/results \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null

          echo ""
          echo "=========================================="
          echo "END DIAGNOSTIC REPORT"
          echo "=========================================="

          exit 0

      # ============================================================
      # COLLECT GENERATED MESHES
      # ============================================================

      - name: Collect generated meshes
        if: always()
        run: |
          set +e

          mkdir -p teacher_output/collected

          echo "=========================================="
          echo "COLLECTING GENERATED MESHES"
          echo "=========================================="

          OBJ_COUNT=$(find . \
            -type f \
            -iname "*.obj" \
            ! -path "./teacher_output/collected/*" \
            | wc -l)

          PLY_COUNT=$(find . \
            -type f \
            -iname "*.ply" \
            ! -path "./teacher_output/collected/*" \
            | wc -l)

          echo "OBJ count: $OBJ_COUNT"
          echo "PLY count: $PLY_COUNT"

          find . \
            -type f \
            -iname "*.obj" \
            ! -path "./teacher_output/collected/*" \
            -exec cp --parents {} teacher_output/collected/ \; \
            2>/dev/null

          find . \
            -type f \
            -iname "*.ply" \
            ! -path "./teacher_output/collected/*" \
            -exec cp --parents {} teacher_output/collected/ \; \
            2>/dev/null

          echo ""
          echo "Collected files:"

          find teacher_output/collected \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null

          exit 0

      # ============================================================
      # MESH VALIDATION
      # ============================================================

      - name: Validate generated mesh
        if: always()
        run: |
          set +e

          echo "=========================================="
          echo "MESH VALIDATION"
          echo "=========================================="

          OBJ_COUNT=$(find teacher_output \
            -type f \
            -iname "*.obj" \
            | wc -l)

          PLY_COUNT=$(find teacher_output \
            -type f \
            -iname "*.ply" \
            | wc -l)

          echo "OBJ count: $OBJ_COUNT"
          echo "PLY count: $PLY_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ] && [ "$PLY_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR: No 3D mesh generated."
            echo ""
            echo "The important diagnostic section is:"
            echo ""
            echo "MARCHING CUBES INTERNAL EXCEPTION"
            echo ""
            echo "Check the inference log above."
            echo ""

            exit 1
          fi

          echo ""
          echo "Generated mesh detected."

          echo ""
          echo "Mesh files:"

          find teacher_output \
            \( -iname "*.obj" -o -iname "*.ply" \) \
            -type f \
            -printf "%p %s bytes\n"

          exit 0

      # ============================================================
      # OBJ GEOMETRY VALIDATION
      # ============================================================

      - name: Validate OBJ geometry
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          print("==========================================")
          print("OBJ GEOMETRY CHECK")
          print("==========================================")

          if not objs:
              print("No OBJ available.")
              raise SystemExit(0)

          for obj in objs:

              vertices = 0
              faces = 0
              colors = 0

              with obj.open(
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:

                      if line.startswith("v "):

                          vertices += 1

                          parts = line.strip().split()

                          if len(parts) >= 7:
                              colors += 1

                      elif line.startswith("f "):

                          faces += 1

              print("")
              print("File:", obj)
              print("Size:", obj.stat().st_size, "bytes")
              print("Vertices:", vertices)
              print("Faces:", faces)
              print("Colored vertices:", colors)

              if vertices == 0:
                  print(
                      "WARNING: OBJ contains no vertices."
                  )

              if faces == 0:
                  print(
                      "WARNING: OBJ contains no faces."
                  )

      # ============================================================
      # TRIMESH VALIDATION
      # ============================================================

      - name: Validate mesh with trimesh
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          try:
              import trimesh

          except Exception as e:

              print(
                  "Could not import trimesh:",
                  e
              )

              raise SystemExit(0)

          print("==========================================")
          print("TRIMESH VALIDATION")
          print("==========================================")

          objs = list(
              Path("teacher_output").rglob("*.obj")
          )

          if not objs:
              print("No OBJ available.")
              raise SystemExit(0)

          for path in objs:

              print("")
              print("Loading:", path)

              try:

                  mesh = trimesh.load(
                      path,
                      process=False,
                      force="mesh"
                  )

                  print(
                      "Vertices:",
                      len(mesh.vertices)
                  )

                  print(
                      "Faces:",
                      len(mesh.faces)
                  )

                  print(
                      "Watertight:",
                      mesh.is_watertight
                  )

                  print(
                      "Bounds:",
                      mesh.bounds
                  )

              except Exception as e:

                  print("TRIMESH ERROR:")
                  print(
                      type(e).__name__,
                      str(e)
                  )

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload PIFuHDC teacher artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-validation
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/checkpoints/net_C_HD.pt
            pifuhdc/results/
          if-no-files-found: warn
          compression-level: 0a
