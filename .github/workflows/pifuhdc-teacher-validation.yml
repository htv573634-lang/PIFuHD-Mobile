name: Step 4A - Real PIFuHDC Teacher Validation

on:
  workflow_dispatch:

jobs:
  teacher-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            scikit-image \
            opencv-python-headless \
            matplotlib \
            tqdm \
            gdown \
            trimesh \
            pyembree

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Verify Python environment
        run: |
          python - <<'PY'
          import torch
          import torchvision
          import numpy
          import scipy
          import PIL
          import cv2
          import matplotlib
          import trimesh

          print()
          print("==========================================")
          print("PYTHON ENVIRONMENT")
          print("==========================================")
          print("Torch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("OpenCV:", cv2.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Trimesh:", trimesh.__version__)
          print()
          print("Environment check passed.")
          PY

      - name: Clone official PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      - name: Prepare checkpoints
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt
          rm -f pifuhdc/checkpoints/net_C_choice2.pt

      - name: Download PIFuHD geometry teacher
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

      - name: Download PIFuHDC color teacher
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt

      - name: Create compatibility color checkpoint
        run: |
          cp \
            pifuhdc/checkpoints/net_C_HD.pt \
            pifuhdc/checkpoints/net_C_choice2.pt

          echo
          echo "=========================================="
          echo "COLOR CHECKPOINTS"
          echo "=========================================="

          ls -lh \
            pifuhdc/checkpoints/net_C_HD.pt \
            pifuhdc/checkpoints/net_C_choice2.pt

      - name: Verify checkpoints
        run: |
          python - <<'PY'
          import os
          import hashlib

          paths = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt",
              "pifuhdc/checkpoints/net_C_choice2.pt"
          ]

          print()
          print("==========================================")
          print("CHECKPOINT VERIFICATION")
          print("==========================================")

          for path in paths:
              if not os.path.exists(path):
                  raise RuntimeError("Missing: " + path)

              size = os.path.getsize(path)

              sha = hashlib.sha256()

              with open(path, "rb") as f:
                  for block in iter(
                      lambda: f.read(1024 * 1024),
                      b""
                  ):
                      sha.update(block)

              print()
              print("File:", path)
              print("Bytes:", size)
              print("MB:", round(size / 1024 / 1024, 2))
              print("SHA256:", sha.hexdigest())

          def sha256(path):
              h = hashlib.sha256()

              with open(path, "rb") as f:
                  for block in iter(
                      lambda: f.read(1024 * 1024),
                      b""
                  ):
                      h.update(block)

              return h.hexdigest()

          if sha256(
              "pifuhdc/checkpoints/net_C_HD.pt"
          ) != sha256(
              "pifuhdc/checkpoints/net_C_choice2.pt"
          ):
              raise RuntimeError(
                  "Color checkpoint alias mismatch."
              )

          print()
          print("All checkpoints verified.")
          PY

      - name: Prepare directories
        run: |
          rm -rf teacher_input
          rm -rf teacher_output
          rm -rf reports

          mkdir -p teacher_input
          mkdir -p teacher_output
          mkdir -p reports

      - name: Download official sample
        run: |
          wget \
            -O teacher_input/sample.jpg \
            https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg

          echo
          echo "=========================================="
          echo "INPUT IMAGE"
          echo "=========================================="

          ls -lh teacher_input/

      - name: Create rectangle metadata
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np

          image_path = "teacher_input/sample.jpg"
          rect_path = "teacher_input/sample_rect.txt"

          image = Image.open(image_path)

          width, height = image.size

          # Full image rectangle.
          rect = np.array(
              [0, 0, width, height],
              dtype=np.int32
          )

          np.savetxt(
              rect_path,
              rect[None, :],
              fmt="%d"
          )

          print()
          print("==========================================")
          print("RECTANGLE")
          print("==========================================")
          print("Image:", width, "x", height)
          print("Rectangle:", rect.tolist())
          print("File:", rect_path)
          print()

          with open(rect_path) as f:
              print(f.read())
          PY

      - name: Verify rectangle dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(
              0,
              os.getcwd()
          )

          from lib.data.EvalDataset import EvalDataset

          class Opt:
              dataroot = "../teacher_input"
              loadSize = 1024

          dataset = EvalDataset(Opt())

          print()
          print("==========================================")
          print("RECTANGLE DATASET TEST")
          print("==========================================")
          print("Dataset root:", dataset.root)
          print("Images:", dataset.img_files)
          print("Dataset size:", len(dataset))
          print()

          if len(dataset) != 1:
              raise RuntimeError(
                  "Rectangle dataset did not find exactly one image."
              )

          print("EvalDataset is working.")
          print("Rectangle mode is ready.")
          PY

      - name: Verify PIFuHDC imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import apps.recon

          print()
          print("==========================================")
          print("PIFuHDC IMPORT TEST")
          print("==========================================")
          print("apps.recon: OK")
          print()
          print("PIFuHDC modules loaded.")
          PY

      - name: Verify inference files
        run: |
          echo
          echo "=========================================="
          echo "INFERENCE INPUT CHECK"
          echo "=========================================="

          test -f teacher_input/sample.jpg
          test -f teacher_input/sample_rect.txt
          test -f pifuhdc/checkpoints/pifuhd.pt
          test -f pifuhdc/checkpoints/net_C_HD.pt

          echo "sample.jpg: OK"
          echo "sample_rect.txt: OK"
          echo "pifuhd.pt: OK"
          echo "net_C_HD.pt: OK"

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          echo
          echo "=========================================="
          echo "REAL PIFuHDC TEACHER INFERENCE"
          echo "=========================================="
          echo
          echo "Input:"
          echo "../teacher_input"
          echo
          echo "Output:"
          echo "../teacher_output"
          echo
          echo "Geometry:"
          echo "./checkpoints/pifuhd.pt"
          echo
          echo "Color:"
          echo "./checkpoints/net_C_HD.pt"
          echo
          echo "Resolution:"
          echo "256"
          echo
          echo "Mode:"
          echo "RECTANGLE / EvalDataset"
          echo
          echo "Starting..."
          echo

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

      - name: Inspect teacher output
        if: always()
        run: |
          echo
          echo "=========================================="
          echo "TEACHER OUTPUT"
          echo "=========================================="

          if [ -d teacher_output ]; then
            find teacher_output \
              -maxdepth 8 \
              -type f \
              -printf "%p %s bytes\n" \
              | sort
          else
            echo "No teacher_output directory."
          fi

      - name: Validate generated OBJ
        if: success()
        run: |
          python - <<'PY'
          import glob
          import os

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("MESH VALIDATION")
          print("==========================================")

          if not paths:
              raise RuntimeError(
                  "No OBJ mesh generated."
              )

          for path in paths:
              size = os.path.getsize(path)

              print()
              print("OBJ:", path)
              print("Bytes:", size)

              if size <= 0:
                  raise RuntimeError(
                      "Empty OBJ: " + path
                  )

          print()
          print("REAL PIFuHDC MESH GENERATED.")

      - name: Analyze mesh
        if: success()
        run: |
          python - <<'PY'
          import glob

          paths = glob.glob(
              "teacher_output/**/*.obj",
              recursive=True
          )

          print()
          print("==========================================")
          print("MESH ANALYSIS")
          print("==========================================")

          for path in paths:
              vertices = 0
              faces = 0

              with open(
                  path,
                  "r",
                  errors="ignore"
              ) as f:

                  for line in f:
                      if line.startswith("v "):
                          vertices += 1

                      elif line.startswith("f "):
                          faces += 1

              print()
              print("File:", path)
              print("Vertices:", vertices)
              print("Faces:", faces)

          print()
          print("Mesh analysis completed.")

      - name: Create report
        if: always()
        run: |
          {
            echo "REAL PIFuHDC TEACHER VALIDATION"
            echo "================================"
            echo
            echo "Geometry:"
            echo "PIFuHD pifuhd.pt"
            echo
            echo "Color:"
            echo "PIFuHDC net_C_HD.pt"
            echo
            echo "Resolution:"
            echo "256"
            echo
            echo "Dataset:"
            echo "EvalDataset / rectangle mode"
            echo
            echo "Checkpoints:"
            ls -lh pifuhdc/checkpoints/
            echo
            echo "Input:"
            ls -lh teacher_input/
            echo
            echo "Output:"
            find teacher_output \
              -maxdepth 8 \
              -type f \
              -printf "%p %s bytes\n" \
              2>/dev/null || true
          } > reports/teacher_validation.txt

          cat reports/teacher_validation.txt

      - name: Upload teacher validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-real-teacher-validation
          path: |
            teacher_output/
            reports/teacher_validation.txt
          if-no-files-found: warn
          retention-days: 7
