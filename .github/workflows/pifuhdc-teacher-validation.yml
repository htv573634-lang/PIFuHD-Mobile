name: PIFuHDC Teacher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-pifuhdc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PIFuHD-Mobile
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            freeglut3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            numpy==1.23.5 \
            scipy \
            pillow \
            scikit-image \
            opencv-python-headless \
            tqdm \
            matplotlib \
            trimesh \
            pyembree

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2

          pip install gdown

      - name: Clone official PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

          echo "=========================================="
          echo "PIFuHDC COMMIT"
          echo "=========================================="

          cd pifuhdc
          git rev-parse HEAD

      - name: Download PIFuHD geometry checkpoint
        working-directory: pifuhdc
        run: |
          mkdir -p checkpoints

          echo "=========================================="
          echo "DOWNLOADING GEOMETRY CHECKPOINT"
          echo "=========================================="

          wget -q --show-progress \
            "https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt" \
            -O checkpoints/pifuhd.pt

          ls -lh checkpoints/pifuhd.pt

      - name: Download PIFuHDC color checkpoint
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "DOWNLOADING COLOR CHECKPOINT"
          echo "=========================================="

          gdown \
            "1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O checkpoints/net_C_HD.pt

          ls -lh checkpoints/net_C_HD.pt

      - name: Verify checkpoints
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "CHECKPOINT VALIDATION"
          echo "=========================================="

          test -f checkpoints/pifuhd.pt
          test -f checkpoints/net_C_HD.pt

          echo ""
          echo "Geometry:"
          ls -lh checkpoints/pifuhd.pt

          echo ""
          echo "Color:"
          ls -lh checkpoints/net_C_HD.pt

          echo ""
          echo "SHA256:"
          sha256sum checkpoints/pifuhd.pt
          sha256sum checkpoints/net_C_HD.pt

      - name: Prepare official test image
        run: |
          rm -rf teacher_input
          rm -rf teacher_output

          mkdir -p teacher_input
          mkdir -p teacher_output

          echo "=========================================="
          echo "DOWNLOADING OFFICIAL PIFuHDC TEST IMAGE"
          echo "=========================================="

          wget -q --show-progress \
            "https://raw.githubusercontent.com/xiahongchi/PIFuHDC/main/images/cxk.jpg" \
            -O teacher_input/sample.jpg

          echo ""
          echo "Input image:"
          ls -lh teacher_input/sample.jpg

          file teacher_input/sample.jpg

      - name: Validate input image
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          p = Path("teacher_input/sample.jpg")

          print("==========================================")
          print("INPUT IMAGE VALIDATION")
          print("==========================================")

          if not p.exists():
              raise SystemExit("ERROR: sample.jpg does not exist")

          img = Image.open(p)

          print("Format:", img.format)
          print("Mode:", img.mode)
          print("Size:", img.size)

          if img.width <= 0 or img.height <= 0:
              raise SystemExit("ERROR: invalid image dimensions")

          img.verify()

          print("Image validation: OK")
          PY

      - name: Create rectangle metadata
        run: |
          python - <<'PY'
          from PIL import Image

          img = Image.open("teacher_input/sample.jpg")

          w, h = img.size

          with open("teacher_input/sample_rect.txt", "w") as f:
              f.write(f"0 0 {w} {h}\n")

          print("==========================================")
          print("RECTANGLE METADATA")
          print("==========================================")
          print(f"Image width : {w}")
          print(f"Image height: {h}")
          print(f"Rectangle   : 0 0 {w} {h}")

          print("")
          print("File:")
          print(open("teacher_input/sample_rect.txt").read())
          PY

      - name: Validate PIFuHDC dataset
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys
          import os

          sys.path.insert(0, os.getcwd())

          from lib.data import EvalDataset

          class Opt:
              dataroot = "../teacher_input"
              loadSize = 1024

          print("==========================================")
          print("DATASET VALIDATION")
          print("==========================================")

          dataset = EvalDataset(Opt())

          print("Dataset length:", len(dataset))
          print("Image files:", dataset.img_files)

          if len(dataset) != 1:
              raise SystemExit(
                  f"ERROR: Expected 1 image, found {len(dataset)}"
              )

          item = dataset[0]

          print("")
          print("Sample name:", item["name"])
          print("img shape:", item["img"].shape)
          print("img_512 shape:", item["img_512"].shape)
          print("calib shape:", item["calib"].shape)
          print("b_min:", item["b_min"])
          print("b_max:", item["b_max"])

          print("")
          print("Dataset validation: OK")
          PY

      - name: Validate imports
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          import sys
          import os

          sys.path.insert(0, os.getcwd())

          print("==========================================")
          print("PYTHON IMPORT VALIDATION")
          print("==========================================")

          import torch
          import torchvision
          import cv2
          import numpy
          import PIL

          print("Python:", sys.version)
          print("PyTorch:", torch.__version__)
          print("Torchvision:", torchvision.__version__)
          print("NumPy:", numpy.__version__)
          print("OpenCV:", cv2.__version__)
          print("Pillow:", PIL.__version__)
          print("CUDA available:", torch.cuda.is_available())

          from lib.model import HGPIFuNetwNML
          from lib.model import HGPIFuMRNet
          from lib.model import HGResBlkPIFuNet
          from lib.mesh_util import reconstruction
          from lib.mesh_util import save_obj_mesh_with_color

          print("")
          print("PIFuHDC imports: OK")
          PY

      - name: Patch PIFuHDC for full traceback
        working-directory: pifuhdc
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/recon.py")
          text = path.read_text()

          old = """    except Exception as e:
        print(e)"""

          new = """    except Exception as e:
        print("")
        print("==========================================")
        print("PIFuHDC INTERNAL EXCEPTION")
        print("==========================================")
        import traceback
        traceback.print_exc()
        print("==========================================")
        raise"""

          count = text.count(old)

          print("Exception handlers found:", count)

          if count == 0:
              raise SystemExit(
                  "ERROR: Could not find the expected exception handler"
              )

          text = text.replace(old, new)

          path.write_text(text)

          print("Full traceback patch applied.")

          print("")
          print("Traceback locations:")

          for number, line in enumerate(text.splitlines(), 1):
              if "traceback.print_exc()" in line:
                  print("line", number)

          PY

      - name: Confirm PIFuHDC patched source
        working-directory: pifuhdc
        run: |
          echo "=========================================="
          echo "PATCHED recon.py CHECK"
          echo "=========================================="

          grep -n -A12 -B3 \
            "traceback.print_exc" \
            apps/recon.py || true

      - name: Run real PIFuHDC teacher
        working-directory: pifuhdc
        run: |
          set +e

          echo "=========================================="
          echo "RUNNING REAL PIFuHDC TEACHER"
          echo "=========================================="

          echo ""
          echo "Input:"
          find ../teacher_input -type f -maxdepth 1 -print

          echo ""
          echo "Checkpoints:"
          ls -lh checkpoints/

          echo ""
          echo "Starting inference..."
          echo ""

          python -m apps.test_colorHD \
            --input_path ../teacher_input \
            --out_path ../teacher_output \
            --ckpt_path ./checkpoints/pifuhd.pt \
            --ckpt_path_Color ./checkpoints/net_C_HD.pt \
            --resolution 256 \
            --use_rect

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "PIFuHDC EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit 0

      - name: Inspect complete PIFuHDC output
        run: |
          set +e

          echo "=========================================="
          echo "PIFuHDC TEACHER DIAGNOSTIC REPORT"
          echo "=========================================="

          echo ""
          echo "WORKSPACE OBJ FILES"
          echo "------------------------------------------"
          find . -type f -iname "*.obj" -print

          echo ""
          echo "WORKSPACE PLY FILES"
          echo "------------------------------------------"
          find . -type f -iname "*.ply" -print

          echo ""
          echo "WORKSPACE PNG FILES"
          echo "------------------------------------------"
          find . -type f -iname "*.png" -print

          echo ""
          echo "teacher_output CONTENTS"
          echo "------------------------------------------"
          find teacher_output -type f -printf "%p %s bytes\n" -print 2>/dev/null

          echo ""
          echo "PIFuHDC RESULTS CONTENTS"
          echo "------------------------------------------"
          find pifuhdc/results -type f -printf "%p %s bytes\n" -print 2>/dev/null

          echo ""
          echo "PIFuHDC DIRECTORY TREE"
          echo "------------------------------------------"
          find pifuhdc -maxdepth 5 -type d | sort

          echo ""
          echo "=========================================="
          echo "END DIAGNOSTIC REPORT"
          echo "=========================================="

          exit 0

      - name: Collect generated meshes
        run: |
          set +e

          mkdir -p teacher_output/collected

          echo "=========================================="
          echo "COLLECTING GENERATED MESHES"
          echo "=========================================="

          OBJ_COUNT=$(find . \
            -type f \
            -iname "*.obj" \
            ! -path "./teacher_output/collected/*" \
            | wc -l)

          PLY_COUNT=$(find . \
            -type f \
            -iname "*.ply" \
            ! -path "./teacher_output/collected/*" \
            | wc -l)

          echo "OBJ count: $OBJ_COUNT"
          echo "PLY count: $PLY_COUNT"

          find . \
            -type f \
            -iname "*.obj" \
            ! -path "./teacher_output/collected/*" \
            -exec cp --parents {} teacher_output/collected/ \; 2>/dev/null

          find . \
            -type f \
            -iname "*.ply" \
            ! -path "./teacher_output/collected/*" \
            -exec cp --parents {} teacher_output/collected/ \; 2>/dev/null

          echo ""
          echo "Collected files:"
          find teacher_output/collected \
            -type f \
            -printf "%p %s bytes\n" \
            2>/dev/null

          exit 0

      - name: Validate generated mesh
        run: |
          set +e

          echo "=========================================="
          echo "MESH VALIDATION"
          echo "=========================================="

          OBJ_COUNT=$(find teacher_output \
            -type f \
            -iname "*.obj" \
            | wc -l)

          PLY_COUNT=$(find teacher_output \
            -type f \
            -iname "*.ply" \
            | wc -l)

          echo "OBJ count: $OBJ_COUNT"
          echo "PLY count: $PLY_COUNT"

          if [ "$OBJ_COUNT" -eq 0 ] && [ "$PLY_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No 3D mesh generated."
            echo ""
            echo "The important information is above in:"
            echo "RUNNING REAL PIFuHDC TEACHER"
            echo ""
            echo "The patched PIFuHDC should now print"
            echo "the complete internal Python traceback."
            exit 1
          fi

          echo ""
          echo "Generated mesh detected."

          echo ""
          echo "Mesh files:"
          find teacher_output \
            \( -iname "*.obj" -o -iname "*.ply" \) \
            -type f \
            -printf "%p %s bytes\n"

          exit 0

      - name: Validate OBJ geometry
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          objs = list(Path("teacher_output").rglob("*.obj"))

          print("==========================================")
          print("OBJ GEOMETRY CHECK")
          print("==========================================")

          if not objs:
              print("No OBJ available.")
              raise SystemExit(0)

          for obj in objs:
              vertices = 0
              faces = 0
              colors = 0

              with obj.open("r", errors="ignore") as f:
                  for line in f:
                      if line.startswith("v "):
                          vertices += 1

                          parts = line.strip().split()

                          if len(parts) >= 7:
                              colors += 1

                      elif line.startswith("f "):
                          faces += 1

              print("")
              print("File:", obj)
              print("Size:", obj.stat().st_size, "bytes")
              print("Vertices:", vertices)
              print("Faces:", faces)
              print("Colored vertices:", colors)

              if vertices == 0:
                  print("WARNING: OBJ contains no vertices.")

              if faces == 0:
                  print("WARNING: OBJ contains no faces.")

      - name: Validate mesh with trimesh
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          try:
              import trimesh
          except Exception as e:
              print("Could not import trimesh:", e)
              raise SystemExit(0)

          print("==========================================")
          print("TRIMESH VALIDATION")
          print("==========================================")

          objs = list(Path("teacher_output").rglob("*.obj"))

          if not objs:
              print("No OBJ available.")
              raise SystemExit(0)

          for path in objs:
              print("")
              print("Loading:", path)

              try:
                  mesh = trimesh.load(
                      path,
                      process=False,
                      force="mesh"
                  )

                  print("Vertices:", len(mesh.vertices))
                  print("Faces:", len(mesh.faces))
                  print("Watertight:", mesh.is_watertight)
                  print("Bounds:", mesh.bounds)

              except Exception as e:
                  print("TRIMESH ERROR:")
                  print(type(e).__name__, str(e))

      - name: Upload PIFuHDC teacher artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-teacher-validation
          path: |
            teacher_input/
            teacher_output/
            pifuhdc/checkpoints/net_C_HD.pt
            pifuhdc/results/
          if-no-files-found: warn
          compression-level: 0
