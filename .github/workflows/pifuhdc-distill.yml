name: Step 3 - PIFuHDC Mobile Distillation Prototype

on:
  workflow_dispatch:

jobs:
  distill-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            opencv-python-headless \
            tqdm \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu

      # ==========================================================
      # GET PIFuHDC SOURCE
      # ==========================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc

      # ==========================================================
      # PREPARE CHECKPOINTS
      # ==========================================================

      - name: Prepare checkpoints
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt

      # ==========================================================
      # DOWNLOAD PIFuHD TEACHER
      # ==========================================================

      - name: Download PIFuHD teacher
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt

      # ==========================================================
      # DOWNLOAD PIFuHDC COLOR TEACHER
      # ==========================================================

      - name: Download PIFuHDC color teacher
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt

      # ==========================================================
      # VERIFY TEACHER CHECKPOINTS
      # ==========================================================

      - name: Verify teacher checkpoints
        run: |
          python - <<'PY'
          import os

          files = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt"
          ]

          print()
          print("==========================================")
          print("TEACHER CHECKPOINTS")
          print("==========================================")

          total = 0

          for path in files:

              if not os.path.exists(path):
                  raise RuntimeError(
                      "Missing checkpoint: " + path
                  )

              size = os.path.getsize(path)
              total += size

              print()
              print("File:", path)
              print("Bytes:", size)
              print(
                  "MB:",
                  round(size / 1024 / 1024, 2)
              )
              print(
                  "GB:",
                  round(size / 1024 / 1024 / 1024, 3)
              )

          print()
          print(
              "Total teacher size MB:",
              round(total / 1024 / 1024, 2)
          )

          print()
          print("Teacher checkpoints verified.")
          PY

      # ==========================================================
      # CREATE DISTILLATION DIRECTORY
      # ==========================================================

      - name: Create distillation directory
        run: |
          mkdir -p distillation
          mkdir -p reports

      # ==========================================================
      # CREATE MOBILE STUDENT
      # ==========================================================

      - name: Create mobile student
        run: |
          cat > distillation/mobile_student.py <<'PY'
          import torch
          import torch.nn as nn


          class MobilePIFuStudent(nn.Module):

              def __init__(self, width=32):

                  super().__init__()

                  self.encoder = nn.Sequential(

                      nn.Conv2d(
                          3,
                          width,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width,
                          width * 2,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width * 2,
                          width * 4,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width * 4,
                          width * 4,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width * 4,
                          width * 4,
                          kernel_size=3,
                          stride=1,
                          padding=1
                      ),

                      nn.ReLU(inplace=True)
                  )

                  self.geometry_head = nn.Sequential(

                      nn.Conv2d(
                          width * 4,
                          width * 2,
                          kernel_size=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width * 2,
                          1,
                          kernel_size=1
                      )
                  )

                  self.color_head = nn.Sequential(

                      nn.Conv2d(
                          width * 4,
                          width * 2,
                          kernel_size=1
                      ),

                      nn.ReLU(inplace=True),

                      nn.Conv2d(
                          width * 2,
                          3,
                          kernel_size=1
                      ),

                      nn.Tanh()
                  )


              def forward(self, x):

                  features = self.encoder(x)

                  geometry = self.geometry_head(
                      features
                  )

                  color = self.color_head(
                      features
                  )

                  return geometry, color


          if __name__ == "__main__":

              model = MobilePIFuStudent(
                  width=32
              )

              parameters = sum(
                  p.numel()
                  for p in model.parameters()
              )

              print()
              print("==========================================")
              print("MOBILE STUDENT")
              print("==========================================")

              print(
                  "Parameters:",
                  parameters
              )

              print(
                  "Parameters (M):",
                  round(
                      parameters / 1_000_000,
                      3
                  )
              )

              x = torch.randn(
                  1,
                  3,
                  256,
                  256
              )

              with torch.no_grad():

                  geometry, color = model(x)

              print(
                  "Input:",
                  tuple(x.shape)
              )

              print(
                  "Geometry:",
                  tuple(geometry.shape)
              )

              print(
                  "Color:",
                  tuple(color.shape)
              )

              fp32_bytes = parameters * 4
              fp16_bytes = parameters * 2

              print(
                  "Estimated FP32 weights:",
                  round(
                      fp32_bytes / 1024 / 1024,
                      2
                  ),
                  "MB"
              )

              print(
                  "Estimated FP16 weights:",
                  round(
                      fp16_bytes / 1024 / 1024,
                      2
                  ),
                  "MB"
              )
          PY

      # ==========================================================
      # TEST STUDENT ARCHITECTURE
      # ==========================================================

      - name: Test mobile student
        run: |
          python distillation/mobile_student.py

      # ==========================================================
      # SYNTHETIC DISTILLATION PROTOTYPE
      # ==========================================================

      - name: Run synthetic distillation experiment
        run: |
          cat > distillation/distill_prototype.py <<'PY'
          import torch
          import torch.nn.functional as F

          from mobile_student import MobilePIFuStudent


          torch.manual_seed(42)

          device = torch.device("cpu")

          student = MobilePIFuStudent(
              width=32
          ).to(device)

          optimizer = torch.optim.Adam(
              student.parameters(),
              lr=1e-3
          )

          print()
          print("==========================================")
          print("SYNTHETIC DISTILLATION TEST")
          print("==========================================")

          print()
          print(
              "This is a technical prototype."
          )

          print(
              "It does NOT yet reproduce "
              "PIFuHDC human reconstruction."
          )

          print(
              "It verifies that the compact "
              "student can train successfully."
          )

          print()

          for step in range(20):

              x = torch.randn(
                  1,
                  3,
                  256,
                  256,
                  device=device
              )

              # --------------------------------------------------
              # Synthetic target
              # --------------------------------------------------

              with torch.no_grad():

                  target_geometry = torch.sigmoid(
                      x.mean(
                          dim=1,
                          keepdim=True
                      )
                  )

                  target_color = torch.tanh(x)

                  target_color = F.avg_pool2d(
                      target_color,
                      kernel_size=16,
                      stride=16
                  )

              # --------------------------------------------------
              # Student
              # --------------------------------------------------

              geometry, color = student(x)

              # --------------------------------------------------
              # Resize targets
              # --------------------------------------------------

              target_geometry = F.interpolate(
                  target_geometry,
                  size=geometry.shape[-2:],
                  mode="bilinear",
                  align_corners=False
              )

              target_color = F.interpolate(
                  target_color,
                  size=color.shape[-2:],
                  mode="bilinear",
                  align_corners=False
              )

              # --------------------------------------------------
              # Loss
              # --------------------------------------------------

              loss_geometry = F.mse_loss(
                  geometry,
                  target_geometry
              )

              loss_color = F.mse_loss(
                  color,
                  target_color
              )

              loss = (
                  loss_geometry +
                  loss_color
              )

              # --------------------------------------------------
              # Backpropagation
              # --------------------------------------------------

              optimizer.zero_grad()

              loss.backward()

              optimizer.step()

              if (
                  step == 0
                  or
                  (step + 1) % 5 == 0
              ):

                  print(
                      "step:",
                      step + 1,
                      "loss:",
                      float(loss)
                  )

          print()
          print(
              "Synthetic distillation test completed."
          )

          # Because this script runs from the repository root,
          # save directly into the distillation directory.

          output = (
              "distillation/"
              "mobile_student_prototype.pt"
          )

          torch.save(
              student.state_dict(),
              output
          )

          print(
              "Saved:",
              output
          )
          PY

          python distillation/distill_prototype.py

      # ==========================================================
      # VERIFY STUDENT CHECKPOINT
      # ==========================================================

      - name: Verify student checkpoint
        run: |
          python - <<'PY'
          import os

          path = (
              "distillation/"
              "mobile_student_prototype.pt"
          )

          print()
          print("==========================================")
          print("STUDENT CHECKPOINT")
          print("==========================================")

          if not os.path.exists(path):
              raise RuntimeError(
                  "Student checkpoint was not created."
              )

          size = os.path.getsize(path)

          print("File:", path)
          print("Bytes:", size)
          print(
              "MB:",
              round(size / 1024 / 1024, 2)
          )

          print()
          print("Student checkpoint verified.")
          PY

      # ==========================================================
      # EXPORT FP16 STUDENT
      # ==========================================================

      - name: Export FP16 student
        run: |
          python - <<'PY'
          import os
          import torch

          from distillation.mobile_student import (
              MobilePIFuStudent
          )

          checkpoint = (
              "distillation/"
              "mobile_student_prototype.pt"
          )

          output = (
              "distillation/"
              "mobile_student_fp16.pt"
          )

          model = MobilePIFuStudent(
              width=32
          )

          state = torch.load(
              checkpoint,
              map_location="cpu"
          )

          model.load_state_dict(state)

          model.eval()

          model.half()

          torch.save(
              model.state_dict(),
              output
          )

          print()
          print("==========================================")
          print("FP16 EXPORT")
          print("==========================================")

          for path in [
              checkpoint,
              output
          ]:

              size = os.path.getsize(path)

              print()
              print("File:", path)

              print(
                  "Bytes:",
                  size
              )

              print(
                  "MB:",
                  round(
                      size / 1024 / 1024,
                      2
                  )
              )

          print()
          print("FP16 export completed.")
          PY

      # ==========================================================
      # TEST FP16 STUDENT
      # ==========================================================

      - name: Test FP16 student
        run: |
          python - <<'PY'
          import torch

          from distillation.mobile_student import (
              MobilePIFuStudent
          )

          checkpoint = (
              "distillation/"
              "mobile_student_fp16.pt"
          )

          model = MobilePIFuStudent(
              width=32
          )

          state = torch.load(
              checkpoint,
              map_location="cpu"
          )

          model.load_state_dict(state)

          model.eval()

          model.half()

          x = torch.randn(
              1,
              3,
              256,
              256
          ).half()

          with torch.no_grad():

              geometry, color = model(x)

          print()
          print("==========================================")
          print("FP16 STUDENT TEST")
          print("==========================================")

          print(
              "Input:",
              tuple(x.shape)
          )

          print(
              "Geometry:",
              tuple(geometry.shape)
          )

          print(
              "Color:",
              tuple(color.shape)
          )

          print()
          print("FP16 inference test passed.")
          PY

      # ==========================================================
      # CREATE REPORT
      # ==========================================================

      - name: Create distillation report
        if: always()
        run: |
          mkdir -p reports

          {
            echo "PIFuHDC MOBILE DISTILLATION PROTOTYPE"
            echo "======================================"
            echo
            echo "TEACHER CHECKPOINTS"
            echo "-------------------"
            ls -lh pifuhdc/checkpoints/
            echo
            echo "STUDENT CHECKPOINTS"
            echo "-------------------"
            ls -lh distillation/
            echo
            echo "STATUS"
            echo "------"
            echo "Student architecture test completed."
            echo
            echo "IMPORTANT"
            echo "This is NOT yet a production PIFuHDC"
            echo "replacement."
            echo
            echo "The next stage must use actual"
            echo "PIFuHDC teacher outputs/data."
          } > reports/distillation_report.txt

          cat reports/distillation_report.txt

      # ==========================================================
      # UPLOAD STUDENT ARTIFACT
      # ==========================================================

      - name: Upload student prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pifuhdc-mobile-distillation-prototype
          path: |
            distillation/mobile_student_prototype.pt
            distillation/mobile_student_fp16.pt
            reports/distillation_report.txt
          if-no-files-found: warn
          retention-days: 7
