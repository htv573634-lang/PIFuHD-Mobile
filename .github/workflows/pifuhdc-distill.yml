name: Step 3 - PIFuHDC Mobile Distillation Prototype

on:
  workflow_dispatch:

jobs:
  distill-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================================
      # 3. SYSTEM PACKAGES
      # ============================================================

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            libgl1 \
            libglib2.0-0


      # ============================================================
      # 4. PYTHON PACKAGES
      # ============================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy==1.26.4 \
            scipy \
            pillow \
            opencv-python-headless \
            tqdm \
            gdown

          pip install \
            torch==2.1.2 \
            torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu


      # ============================================================
      # 5. CLONE OFFICIAL PIFuHDC
      # ============================================================

      - name: Clone PIFuHDC
        run: |
          rm -rf pifuhdc

          git clone \
            --depth 1 \
            https://github.com/xiahongchi/PIFuHDC.git \
            pifuhdc


      # ============================================================
      # 6. PREPARE CHECKPOINT DIRECTORY
      # ============================================================

      - name: Prepare checkpoints
        run: |
          mkdir -p pifuhdc/checkpoints

          rm -f pifuhdc/checkpoints/pifuhd.pt
          rm -f pifuhdc/checkpoints/pifuhd.pt.1
          rm -f pifuhdc/checkpoints/net_C_HD.pt


      # ============================================================
      # 7. DOWNLOAD PIFuHD TEACHER
      # ============================================================

      - name: Download PIFuHD teacher
        run: |
          wget \
            --progress=dot:giga \
            -O pifuhdc/checkpoints/pifuhd.pt \
            https://dl.fbaipublicfiles.com/pifuhd/checkpoints/pifuhd.pt


      # ============================================================
      # 8. DOWNLOAD PIFuHDC COLOR TEACHER
      # ============================================================

      - name: Download PIFuHDC color teacher
        run: |
          gdown \
            "https://drive.google.com/uc?id=1jSOpwJKFJWHxkCEplhz0AUGacQBIS4AM" \
            -O pifuhdc/checkpoints/net_C_HD.pt


      # ============================================================
      # 9. VERIFY TEACHER MODELS
      # ============================================================

      - name: Verify teacher checkpoints
        run: |
          python - <<'PY'
          import os

          files = [
              "pifuhdc/checkpoints/pifuhd.pt",
              "pifuhdc/checkpoints/net_C_HD.pt"
          ]

          print()
          print("==========================================")
          print("PIFuHDC TEACHER CHECKPOINTS")
          print("==========================================")

          total = 0

          for path in files:

              if not os.path.exists(path):
                  raise RuntimeError(
                      "Missing checkpoint: " + path
                  )

              size = os.path.getsize(path)

              total += size

              print()
              print("File:", path)
              print("Bytes:", size)

              print(
                  "MB:",
                  round(
                      size / 1024 / 1024,
                      2
                  )
              )

              print(
                  "GB:",
                  round(
                      size / 1024 / 1024 / 1024,
                      3
                  )
              )

          print()
          print(
              "Total teacher size MB:",
              round(
                  total / 1024 / 1024,
                  2
              )
          )

          print()
          print(
              "Teacher checkpoints verified successfully."
          )
          PY


      # ============================================================
      # 10. CREATE DIRECTORIES
      # ============================================================

      - name: Create project directories
        run: |
          mkdir -p distillation
          mkdir -p reports


      # ============================================================
      # 11. CREATE MOBILE STUDENT
      # ============================================================

      - name: Create mobile student
        run: |
          cat > distillation/mobile_student.py <<'PY'

          import torch
          import torch.nn as nn


          class MobilePIFuStudent(nn.Module):

              def __init__(self, width=32):

                  super().__init__()

                  self.encoder = nn.Sequential(

                      nn.Conv2d(
                          3,
                          width,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width,
                          width * 2,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width * 2,
                          width * 4,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width * 4,
                          width * 4,
                          kernel_size=3,
                          stride=2,
                          padding=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width * 4,
                          width * 4,
                          kernel_size=3,
                          stride=1,
                          padding=1
                      ),

                      nn.ReLU(
                          inplace=True
                      )
                  )


                  # Geometry / occupancy head

                  self.geometry_head = nn.Sequential(

                      nn.Conv2d(
                          width * 4,
                          width * 2,
                          kernel_size=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width * 2,
                          1,
                          kernel_size=1
                      )
                  )


                  # RGB color head

                  self.color_head = nn.Sequential(

                      nn.Conv2d(
                          width * 4,
                          width * 2,
                          kernel_size=1
                      ),

                      nn.ReLU(
                          inplace=True
                      ),

                      nn.Conv2d(
                          width * 2,
                          3,
                          kernel_size=1
                      ),

                      nn.Tanh()
                  )


              def forward(self, x):

                  features = self.encoder(x)

                  geometry = (
                      self.geometry_head(
                          features
                      )
                  )

                  color = (
                      self.color_head(
                          features
                      )
                  )

                  return geometry, color


          if __name__ == "__main__":

              model = MobilePIFuStudent(
                  width=32
              )

              parameters = sum(
                  p.numel()
                  for p in model.parameters()
              )

              print()
              print("==========================================")
              print("MOBILE PIFuHDC STUDENT")
              print("==========================================")

              print(
                  "Parameters:",
                  parameters
              )

              print(
                  "Parameters (M):",
                  round(
                      parameters / 1_000_000,
                      3
                  )
              )


              x = torch.randn(
                  1,
                  3,
                  256,
                  256
              )


              with torch.no_grad():

                  geometry, color = model(x)


              print(
                  "Input:",
                  tuple(x.shape)
              )

              print(
                  "Geometry:",
                  tuple(geometry.shape)
              )

              print(
                  "Color:",
                  tuple(color.shape)
              )


              fp32_bytes = (
                  parameters * 4
              )

              fp16_bytes = (
                  parameters * 2
              )


              print(
                  "Estimated FP32 weights:",
                  round(
                      fp32_bytes / 1024 / 1024,
                      2
                  ),
                  "MB"
              )

              print(
                  "Estimated FP16 weights:",
                  round(
                      fp16_bytes / 1024 / 1024,
                      2
                  ),
                  "MB"
              )


              print()
              print(
                  "Student architecture test passed."
              )

          PY


      # ============================================================
      # 12. TEST STUDENT
      # ============================================================

      - name: Test mobile student
        run: |
          python distillation/mobile_student.py


      # ============================================================
      # 13. SYNTHETIC DISTILLATION PROTOTYPE
      # ============================================================

      - name: Run synthetic distillation experiment
        run: |
          cat > distillation/distill_prototype.py <<'PY'

          import torch
          import torch.nn.functional as F

          from mobile_student import (
              MobilePIFuStudent
          )


          torch.manual_seed(42)


          device = torch.device(
              "cpu"
          )


          student = MobilePIFuStudent(
              width=32
          ).to(device)


          optimizer = torch.optim.Adam(
              student.parameters(),
              lr=1e-3
          )


          print()
          print("==========================================")
          print("SYNTHETIC DISTILLATION TEST")
          print("==========================================")

          print()

          print(
              "This is a technical prototype."
          )

          print(
              "It does NOT yet reproduce "
              "PIFuHDC human reconstruction."
          )

          print(
              "It verifies that the compact "
              "student can train successfully."
          )

          print()


          for step in range(20):


              x = torch.randn(
                  1,
                  3,
                  256,
                  256,
                  device=device
              )


              with torch.no_grad():

                  target_geometry = torch.sigmoid(
                      x.mean(
                          dim=1,
                          keepdim=True
                      )
                  )


                  target_color = torch.tanh(
                      x
                  )


                  target_color = F.avg_pool2d(
                      target_color,
                      kernel_size=16,
                      stride=16
                  )


              geometry, color = student(
                  x
              )


              target_geometry = F.interpolate(
                  target_geometry,
                  size=geometry.shape[-2:],
                  mode="bilinear",
                  align_corners=False
              )


              target_color = F.interpolate(
                  target_color,
                  size=color.shape[-2:],
                  mode="bilinear",
                  align_corners=False
              )


              loss_geometry = F.mse_loss(
                  geometry,
                  target_geometry
              )


              loss_color = F.mse_loss(
                  color,
                  target_color
              )


              loss = (
                  loss_geometry +
                  loss_color
              )


              optimizer.zero_grad()

              loss.backward()

              optimizer.step()


              if (
                  step == 0
                  or
                  (step + 1) % 5 == 0
              ):

                  print(
                      "step:",
                      step + 1,
                      "loss:",
                      float(loss)
                  )


          print()

          print(
              "Synthetic distillation test completed."
          )


          output = (
              "distillation/"
              "mobile_student_prototype.pt"
          )


          torch.save(
              student.state_dict(),
              output
          )


          print(
              "Saved:",
              output
          )

          PY


          python distillation/distill_prototype.py


      # ============================================================
      # 14. VERIFY FP32 STUDENT
      # ============================================================

      - name: Verify student checkpoint
        run: |
          python - <<'PY'

          import os

          path = (
              "distillation/"
              "mobile_student_prototype.pt"
          )


          print()
          print("==========================================")
          print("FP32 STUDENT CHECKPOINT")
          print("==========================================")


          if not os.path.exists(path):

              raise RuntimeError(
                  "Student checkpoint was not created."
              )


          size = os.path.getsize(
              path
          )


          print(
              "File:",
              path
          )

          print(
              "Bytes:",
              size
          )

          print(
              "MB:",
              round(
                  size / 1024 / 1024,
                  2
              )
          )


          print()

          print(
              "FP32 student checkpoint verified."
          )

          PY


      # ============================================================
      # 15. EXPORT FP16
      # ============================================================

      - name: Export FP16 student
        run: |
          python - <<'PY'

          import os
          import torch

          from distillation.mobile_student import (
              MobilePIFuStudent
          )


          checkpoint = (
              "distillation/"
              "mobile_student_prototype.pt"
          )


          output = (
              "distillation/"
              "mobile_student_fp16.pt"
          )


          model = MobilePIFuStudent(
              width=32
          )


          state = torch.load(
              checkpoint,
              map_location="cpu"
          )


          model.load_state_dict(
              state
          )


          model.eval()


          # Convert weights to FP16.
          #
          # This is an export operation.
          # CPU Conv2D inference with Half is NOT
          # attempted here because standard PyTorch
          # CPU backend does not implement it reliably.

          model.half()


          torch.save(
              model.state_dict(),
              output
          )


          print()
          print("==========================================")
          print("FP16 EXPORT")
          print("==========================================")


          for path in [
              checkpoint,
              output
          ]:

              size = os.path.getsize(
                  path
              )


              print()

              print(
                  "File:",
                  path
              )

              print(
                  "Bytes:",
                  size
              )

              print(
                  "MB:",
                  round(
                      size / 1024 / 1024,
                      2
                  )
              )


          print()

          print(
              "FP16 export completed successfully."
          )

          PY


      # ============================================================
      # 16. VALIDATE FP16 CHECKPOINT
      # ============================================================

      - name: Validate FP16 student
        run: |
          python - <<'PY'

          import torch

          from distillation.mobile_student import (
              MobilePIFuStudent
          )


          checkpoint = (
              "distillation/"
              "mobile_student_fp16.pt"
          )


          model = MobilePIFuStudent(
              width=32
          )


          state = torch.load(
              checkpoint,
              map_location="cpu"
          )


          model.load_state_dict(
              state
          )


          print()
          print("==========================================")
          print("FP16 STUDENT VALIDATION")
          print("==========================================")


          fp16_tensors = 0

          total_tensors = 0


          for name, tensor in state.items():

              if torch.is_tensor(tensor):

                  total_tensors += 1


                  if tensor.dtype == torch.float16:

                      fp16_tensors += 1


                  print(
                      name,
                      "dtype=",
                      tensor.dtype,
                      "shape=",
                      tuple(tensor.shape)
                  )


          print()

          print(
              "FP16 tensors:",
              fp16_tensors,
              "/",
              total_tensors
          )


          if fp16_tensors == 0:

              raise RuntimeError(
                  "FP16 checkpoint validation failed."
              )


          if fp16_tensors != total_tensors:

              raise RuntimeError(
                  "Not all model tensors are FP16."
              )


          print()

          print(
              "All model tensors are FP16."
          )


          # --------------------------------------------------------
          # IMPORTANT
          # --------------------------------------------------------
          #
          # GitHub Actions uses CPU PyTorch.
          #
          # Standard PyTorch CPU Conv2D does not support
          # Half/FP16 reliably:
          #
          # slow_conv2d_cpu not implemented for 'Half'
          #
          # Therefore we DO NOT run:
          #
          # model.half()
          # model(x.half())
          #
          # on the GitHub CPU.
          #
          # Instead, we verify the FP16 weights above and
          # run a separate FP32 CPU compatibility inference.
          #
          # Actual mobile FP16 inference will happen later
          # through ONNX/MNN/mobile acceleration.

          # --------------------------------------------------------
          # CPU compatibility inference
          # --------------------------------------------------------

          model.float()

          model.eval()


          x = torch.randn(
              1,
              3,
              256,
              256
          )


          with torch.no_grad():

              geometry, color = model(
                  x
              )


          print()

          print(
              "CPU compatibility inference passed."
          )


          print(
              "Input:",
              tuple(x.shape)
          )


          print(
              "Geometry:",
              tuple(geometry.shape)
          )


          print(
              "Color:",
              tuple(color.shape)
          )


          print()

          print(
              "FP16 checkpoint is valid."
          )


          print(
              "GitHub CPU FP16 Conv2D test was "
              "intentionally skipped."
          )


          print()

          print(
              "Next mobile stage:"
          )

          print(
              "FP16 -> ONNX/MNN -> Android"
          )

          PY


      # ============================================================
      # 17. CREATE REPORT
      # ============================================================

      - name: Create distillation report
        if: always()
        run: |
          mkdir -p reports

          {
            echo "PIFuHDC MOBILE DISTILLATION PROTOTYPE"
            echo "======================================"
            echo

            echo "TEACHER CHECKPOINTS"
            echo "-------------------"

            ls -lh \
              pifuhdc/checkpoints/

            echo

            echo "STUDENT CHECKPOINTS"
            echo "-------------------"

            ls -lh \
              distillation/

            echo

            echo "STATUS"
            echo "------"

            echo "Student architecture test completed."

            echo

            echo "Synthetic training completed."

            echo

            echo "FP32 student checkpoint created."

            echo

            echo "FP16 student checkpoint created."

            echo

            echo "FP16 checkpoint tensors validated."

            echo

            echo "GitHub CPU FP16 Conv2D test skipped"
            echo "because PyTorch CPU does not implement"
            echo "Half Conv2D."

            echo

            echo "IMPORTANT"
            echo "---------"

            echo "This is NOT yet a production"
            echo "PIFuHDC replacement."

            echo

            echo "The current student was trained using"
            echo "synthetic targets."

            echo

            echo "The next stage must use actual"
            echo "PIFuHDC teacher outputs/data."

            echo

            echo "TARGET MOBILE PIPELINE"
            echo "----------------------"

            echo "PIFuHDC teacher"
            echo "      ->"
            echo "teacher geometry + color"
            echo "      ->"
            echo "mobile student"
            echo "      ->"
            echo "FP16 / INT8"
            echo "      ->"
            echo "ONNX / MNN"
            echo "      ->"
            echo "Android ARM64"
            echo "      ->"
            echo "3D human + texture"

          } > reports/distillation_report.txt


          cat reports/distillation_report.txt


      # ============================================================
      # 18. UPLOAD ONLY SMALL STUDENT ARTIFACTS
      # ============================================================

      - name: Upload student prototype
        if: always()
        uses: actions/upload-artifact@v4

        with:

          name: pifuhdc-mobile-distillation-prototype

          path: |
            distillation/mobile_student_prototype.pt
            distillation/mobile_student_fp16.pt
            reports/distillation_report.txt

          if-no-files-found: warn

          retention-days: 7
